// NUTRITION PAGE
// ═══════════════════════════════════════════════
function NutritionPage({log,selectedDay,updateLog,setShowPicker,mealPlan}){
  const isToday=selectedDay===todayKey();
  const isSport=log.isSportDay!==false;
  const done=mealPlan.filter(m=>log.meals?.[m.id]);
  const totalK=done.reduce((s,m)=>s+m.kcal,0);
  const maxK=mealPlan.reduce((s,m)=>s+m.kcal,0);
  const totalP=done.reduce((s,m)=>s+m.prot,0);
  const totalC=done.reduce((s,m)=>s+m.carbs,0);
  const totalF=done.reduce((s,m)=>s+(m.fat||0),0);

  return(
    <div style={{padding:"20px 20px 0"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <h2 style={{fontWeight:800,fontSize:22,margin:0}}>📋 Plan Nutrition</h2>
        <button onClick={()=>setShowPicker(true)} style={{background:"var(--glass)",border:"1px solid var(--border2)",borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:700,color:"var(--text2)",cursor:"pointer",fontFamily:"var(--font)"}}>📅 {isToday?"Aujourd'hui":formatDate(selectedDay)} ▾</button>
      </div>

      {/* Sport / Repos toggle */}
      <div style={{display:"flex",gap:8,marginBottom:16,background:"rgba(255,255,255,0.04)",borderRadius:16,padding:4}}>
        {["sport","repos"].map(t=>(
          <button key={t} onClick={()=>updateLog(selectedDay,l=>({...l,isSportDay:t==="sport"}))} style={{flex:1,padding:"10px",borderRadius:12,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,transition:"all 0.2s",background:(t==="sport"?isSport:!isSport)?(t==="sport"?"var(--green)":"#4a9eff"):"transparent",color:(t==="sport"?isSport:!isSport)?"#080b14":"var(--text2)",fontFamily:"var(--font)"}}>
            {t==="sport"?"💪 Jour de sport":"😴 Jour de repos"}
          </button>
        ))}
      </div>

      {/* Variants */}
      {isSport&&(
        <GlassCard style={{marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:14,color:"var(--text2)",letterSpacing:0.5}}>🔄 Variantes du jour</div>
          {[{title:"🥩 Protéine",variants:PROTEIN_VARIANTS,key:log.proteinKey||"poulet",onSelect:k=>updateLog(selectedDay,l=>({...l,proteinKey:k,meals:{}}))}
           ,{title:"🍚 Glucides post-workout",variants:CARB_VARIANTS,key:log.carbKey||"riz",onSelect:k=>updateLog(selectedDay,l=>({...l,carbKey:k,meals:{}}))}
          ].map(({title,variants,key,onSelect})=>(
            <div key={title} style={{marginBottom:12}}>
              <div style={{fontSize:10,fontWeight:700,color:"var(--text3)",marginBottom:8,textTransform:"uppercase",letterSpacing:0.5}}>{title}</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {Object.entries(variants).map(([k,v])=>{
                  const active=key===k;
                  return <button key={k} onClick={()=>onSelect(k)} style={{padding:"6px 12px",borderRadius:20,border:`2px solid ${active?v.color:"var(--border)"}`,background:active?`${v.color}18`:"transparent",color:active?v.color:"var(--text2)",fontSize:12,fontWeight:700,cursor:"pointer",transition:"all 0.15s",fontFamily:"var(--font)",display:"flex",alignItems:"center",gap:4}}><span>{v.emoji}</span>{v.label}</button>;
                })}
              </div>
            </div>
          ))}
          <div style={{fontSize:10,color:"var(--text3)",marginTop:4}}>⚠️ Changer réinitialise les coches</div>
        </GlassCard>
      )}

      {/* Macro pills */}
      <div style={{display:"flex",gap:6,marginBottom:20}}>
        <Pill label="Kcal" value={totalK} unit={`/${maxK}`} color="var(--green)"/>
        <Pill label="Prot." value={`${totalP}g`} color="var(--orange)"/>
        <Pill label="Carbs" value={`${totalC}g`} color="var(--cyan)"/>
        <Pill label="Lip." value={`${totalF}g`} color="var(--yellow)"/>
      </div>

      {/* Meal cards */}
      {mealPlan.map((meal,idx)=>{
        const checked=log.meals?.[meal.id];
        return(
          <div key={meal.id} style={{background:checked?"rgba(168,255,120,0.05)":"var(--glass)",border:`1px solid ${checked?"rgba(168,255,120,0.2)":"var(--border)"}`,borderRadius:20,padding:"14px 16px",marginBottom:10,transition:"all 0.2s",animation:`fadeUp 0.3s ease ${idx*0.05}s both`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:checked||true?8:0}}>
              <div style={{display:"flex",alignItems:"flex-start",gap:10,flex:1,minWidth:0}}>
                <span style={{fontSize:22,flexShrink:0}}>{meal.emoji}</span>
                <div style={{minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13,lineHeight:1.4,display:"flex",flexWrap:"wrap",alignItems:"center",gap:4}}>
                    <span>{meal.label}</span>
                    {meal.proteinKey&&<Tag color={meal.proteinColor}>{meal.proteinEmoji} {meal.proteinLabel}</Tag>}
                    {meal.carbKey&&<Tag color={meal.carbColor}>{meal.carbEmoji} {meal.carbLabel}</Tag>}
                  </div>
                  <div style={{fontSize:11,color:"var(--text3)",marginTop:2,fontFamily:"var(--mono)"}}>⏰ {meal.time}</div>
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0,marginLeft:8}}>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:13,fontWeight:700,color:"var(--green)",fontFamily:"var(--mono)"}}>{meal.kcal} kcal</div>
                  <div style={{fontSize:10,color:"var(--text3)",fontFamily:"var(--mono)"}}>{meal.prot}P · {meal.carbs}C</div>
                </div>
                <div onClick={()=>updateLog(selectedDay,l=>({...l,meals:{...l.meals,[meal.id]:!l.meals?.[meal.id]}}))}
                  style={{width:32,height:32,borderRadius:10,cursor:"pointer",background:checked?"var(--green)":"rgba(255,255,255,0.07)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,color:"#080b14",fontWeight:800,transition:"all 0.2s",flexShrink:0,boxShadow:checked?"0 0 12px rgba(168,255,120,0.4)":"none"}}>
                  {checked?"✓":""}
                </div>
              </div>
            </div>
            <MealItems items={meal.items}/>
          </div>
        );
      })}

      {/* Supplements */}
      <h3 style={{fontWeight:700,fontSize:15,margin:"24px 0 12px",color:"var(--text)"}}>💊 Suppléments</h3>
      {SUPPLEMENTS.map(s=>(
        <div key={s.id} onClick={()=>updateLog(selectedDay,l=>({...l,supplements:{...l.supplements,[s.id]:!l.supplements?.[s.id]}}))}
          style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:log.supplements?.[s.id]?"rgba(168,255,120,0.05)":"var(--glass)",border:`1px solid ${log.supplements?.[s.id]?"rgba(168,255,120,0.2)":"var(--border)"}`,borderRadius:14,marginBottom:8,cursor:"pointer",transition:"all 0.2s"}}>
          <span style={{fontSize:22}}>{s.emoji}</span>
          <div style={{flex:1}}><div style={{fontWeight:600,fontSize:13}}>{s.label}</div><div style={{fontSize:11,color:"var(--text3)",fontFamily:"var(--mono)"}}>⏰ {s.time}</div></div>
          <div style={{width:28,height:28,borderRadius:8,background:log.supplements?.[s.id]?"var(--green)":"rgba(255,255,255,0.07)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"#080b14",fontWeight:800,transition:"all 0.2s",boxShadow:log.supplements?.[s.id]?"0 0 10px rgba(168,255,120,0.4)":"none"}}>{log.supplements?.[s.id]?"✓":""}</div>
        </div>
      ))}

      {/* Water */}
      <h3 style={{fontWeight:700,fontSize:15,margin:"24px 0 12px"}}>💧 Eau</h3>
      <GlassCard style={{marginBottom:28}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <span style={{fontWeight:600,fontSize:13,fontFamily:"var(--mono)"}}>{(log.water||0)*250}ml / 2000ml</span>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>updateLog(selectedDay,l=>({...l,water:Math.max(0,(l.water||0)-1)}))} style={{background:"var(--glass)",border:"1px solid var(--border)",borderRadius:8,color:"var(--text)",width:34,height:34,cursor:"pointer",fontSize:18,fontFamily:"var(--font)"}}>−</button>
            <button onClick={()=>updateLog(selectedDay,l=>({...l,water:Math.min(8,(l.water||0)+1)}))} style={{background:"rgba(0,229,255,0.12)",border:"1px solid rgba(0,229,255,0.3)",borderRadius:8,color:"var(--cyan)",width:34,height:34,cursor:"pointer",fontSize:18,fontWeight:800,fontFamily:"var(--font)"}}>+</button>
          </div>
        </div>
        <div style={{display:"flex",gap:5}}>
          {Array.from({length:8}).map((_,i)=>(
            <div key={i} onClick={()=>updateLog(selectedDay,l=>({...l,water:i<(l.water||0)?i:i+1}))}
              style={{flex:1,height:32,borderRadius:8,cursor:"pointer",background:i<(log.water||0)?"rgba(0,229,255,0.25)":"rgba(255,255,255,0.04)",border:`1px solid ${i<(log.water||0)?"rgba(0,229,255,0.4)":"var(--border)"}`,transition:"all 0.2s",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>
              {i<(log.water||0)&&"💧"}
            </div>
          ))}
        </div>
      </GlassCard>
    </div>
  );
}

// ═══════════════════════════════════════════════
// TRACKING PAGE
// ═══════════════════════════════════════════════
function TrackingPage({log,selectedDay,updateLog,setShowPicker,customFoods}){
  const isToday=selectedDay===todayKey();
  const [activeSlot,setActiveSlot]=useState(null);
  const [activeManualSlot,setActiveManualSlot]=useState(null); // for manual entry
  const [search,setSearch]=useState("");
  const [pendingFood,setPendingFood]=useState(null);
  const [amount,setAmount]=useState("");
  const [unit,setUnit]=useState("");
  const [showOverride,setShowOverride]=useState(false);
  const [manualEntry,setManualEntry]=useState({name:"",kcal:"",prot:"",carbs:"",fat:""});
  const searchRef=useRef(null);
  const allFoods=[...FOOD_DB,...(customFoods||[]).map(f=>({...f,id:"custom_"+f.id}))];

  const trackingLog=log.trackingLog||{};
  const override=log.trackingOverride||null; // {kcal,prot,carbs,fat}
  const allItems=Object.values(trackingLog).flat();

  // Computed totals from logged items
  const autoKcal=allItems.reduce((s,it)=>s+it.kcal,0);
  const autoProt=Math.round(allItems.reduce((s,it)=>s+it.prot,0));
  const autoCarbs=Math.round(allItems.reduce((s,it)=>s+it.carbs,0));
  const autoFat=Math.round(allItems.reduce((s,it)=>s+it.fat,0));

  // Display values — override takes precedence
  const isOverride=!!override;
  const totalKcal=isOverride?override.kcal:autoKcal;
  const totalProt=isOverride?override.prot:autoProt;
  const totalCarbs=isOverride?override.carbs:autoCarbs;
  const totalFat=isOverride?override.fat:autoFat;

  const TARGET_KCAL=log.isSportDay!==false?2100:1950;
  const TARGET_PROT=190;

  // Override state for the panel
  const [overrideForm,setOverrideForm]=useState({
    kcal:override?.kcal||"",prot:override?.prot||"",carbs:override?.carbs||"",fat:override?.fat||""
  });

  function saveOverride(){
    const o={kcal:parseInt(overrideForm.kcal)||0,prot:parseInt(overrideForm.prot)||0,carbs:parseInt(overrideForm.carbs)||0,fat:parseInt(overrideForm.fat)||0};
    updateLog(selectedDay,l=>({...l,trackingOverride:o}));
    setShowOverride(false);
  }
  function resetOverride(){
    updateLog(selectedDay,l=>{const nl={...l};delete nl.trackingOverride;return nl;});
    setShowOverride(false);
  }

  const sq=search.toLowerCase().trim();
  const filtered=sq?allFoods.filter(f=>f.name.toLowerCase().includes(sq)||f.cat.toLowerCase().includes(sq)):[];

  function selectFood(food){
    setPendingFood(food);setUnit(food.defaultUnit);
    if(["qty","half","can","tsp","scoop"].includes(food.defaultUnit)) setAmount("1");
    else if(food.id==="blancs_oeuf") setAmount("150");
    else setAmount("100");
    setSearch("");
  }
  function addItem(){
    if(!pendingFood||!amount||!activeSlot) return;
    const macros=calcFoodMacros(pendingFood,amount,unit);
    if(macros.kcal===0&&macros.prot===0) return;
    const entry={id:Date.now(),foodId:pendingFood.id,name:pendingFood.name,amount:parseFloat(amount),unit,...macros};
    updateLog(selectedDay,l=>{const tl=l.trackingLog||{};return{...l,trackingLog:{...tl,[activeSlot]:[...(tl[activeSlot]||[]),entry]}};});
    setPendingFood(null);setAmount("");
    if(searchRef.current) searchRef.current.focus();
  }
  function addManualItem(){
    if(!manualEntry.kcal&&!manualEntry.prot) return;
    const slot=activeManualSlot||activeSlot;
    if(!slot) return;
    const entry={id:Date.now(),foodId:"manual",name:manualEntry.name||"Repas manuel",amount:1,unit:"qty",isManual:true,
      kcal:parseInt(manualEntry.kcal)||0,prot:parseFloat(manualEntry.prot)||0,carbs:parseFloat(manualEntry.carbs)||0,fat:parseFloat(manualEntry.fat)||0};
    updateLog(selectedDay,l=>{const tl=l.trackingLog||{};return{...l,trackingLog:{...tl,[slot]:[...(tl[slot]||[]),entry]}};});
    setManualEntry({name:"",kcal:"",prot:"",carbs:"",fat:""});
    setActiveManualSlot(null);
  }
  function removeItem(slotId,itemId){
    updateLog(selectedDay,l=>({...l,trackingLog:{...l.trackingLog,[slotId]:(l.trackingLog?.[slotId]||[]).filter(it=>it.id!==itemId)}}));
  }
  const preview=pendingFood&&parseFloat(amount)>0?calcFoodMacros(pendingFood,parseFloat(amount),unit):null;

  // ── Slot detail view ──
  if(activeSlot){
    const slot=MEAL_SLOTS.find(s=>s.id===activeSlot);
    const slotItems=trackingLog[activeSlot]||[];
    const slotKcal=slotItems.reduce((s,it)=>s+it.kcal,0);
    const cats=[...new Set(allFoods.map(f=>f.cat))];
    return(
      <div style={{padding:"20px 20px 0"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <button onClick={()=>{setActiveSlot(null);setPendingFood(null);setSearch("");setActiveManualSlot(null);}} style={{background:"var(--glass)",border:"1px solid var(--border)",borderRadius:12,color:"var(--text)",padding:"8px 16px",cursor:"pointer",fontWeight:700,fontSize:13,fontFamily:"var(--font)"}}>← Retour</button>
          <div>
            <div style={{fontWeight:800,fontSize:17}}>{slot.emoji} {slot.label}</div>
            <div style={{fontSize:11,color:"var(--text3)",fontFamily:"var(--mono)"}}>{slotKcal} kcal · {slotItems.length} aliment(s)</div>
          </div>
        </div>
        {slotItems.length>0&&(
          <GlassCard style={{marginBottom:14,padding:"12px 14px"}}>
            {slotItems.map(it=>{
              const f=allFoods.find(fd=>fd.id===it.foodId||"custom_"+fd.id===it.foodId);
              return(
                <div key={it.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid var(--border)"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:600,display:"flex",alignItems:"center",gap:5}}>
                      {it.name}
                      {it.isManual&&<span style={{fontSize:9,color:"var(--cyan)",background:"rgba(0,229,255,0.1)",border:"1px solid rgba(0,229,255,0.2)",borderRadius:6,padding:"1px 5px"}}>Manuel</span>}
                    </div>
                    <div style={{fontSize:10,color:"var(--text3)",fontFamily:"var(--mono)"}}>{it.isManual?"Entrée manuelle":`${it.amount} ${unitLabel(it.unit,f)}`}</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <MacroBadge kcal={it.kcal} prot={it.prot} carbs={it.carbs} fat={it.fat}/>
                    <button onClick={()=>removeItem(activeSlot,it.id)} style={{background:"rgba(255,95,109,0.1)",border:"none",borderRadius:6,color:"var(--red)",width:24,height:24,cursor:"pointer",fontSize:14,flexShrink:0}}>✕</button>
                  </div>
                </div>
              );
            })}
          </GlassCard>
        )}

        {/* Manual entry panel */}
        {activeManualSlot===activeSlot?(
          <div style={{background:"rgba(0,229,255,0.04)",border:"1px solid rgba(0,229,255,0.15)",borderRadius:18,padding:14,marginBottom:12,animation:"fadeUp 0.2s ease"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{fontWeight:700,fontSize:13,color:"var(--cyan)"}}>✏️ Entrée manuelle</span>
              <button onClick={()=>setActiveManualSlot(null)} style={{background:"none",border:"none",color:"var(--text3)",fontSize:18,cursor:"pointer"}}>✕</button>
            </div>
            <input value={manualEntry.name} onChange={e=>setManualEntry(p=>({...p,name:e.target.value}))} placeholder="Description (ex: Repas restaurant)"
              style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"9px 12px",color:"var(--text)",fontSize:16,outline:"none",boxSizing:"border-box",fontFamily:"var(--font)",marginBottom:8}}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
              {[{k:"kcal",l:"Calories",c:"var(--green)"},{k:"prot",l:"Protéines (g)",c:"var(--orange)"},{k:"carbs",l:"Glucides (g)",c:"var(--cyan)"},{k:"fat",l:"Lipides (g)",c:"var(--yellow)"}].map(f=>(
                <div key={f.k}>
                  <label style={{fontSize:9,color:f.c,fontWeight:700,textTransform:"uppercase"}}>{f.l}</label>
                  <input type="number" value={manualEntry[f.k]} onChange={e=>setManualEntry(p=>({...p,[f.k]:e.target.value}))} placeholder="0"
                    style={{display:"block",width:"100%",marginTop:3,background:"rgba(255,255,255,0.06)",border:`1px solid ${f.c}33`,borderRadius:8,padding:"8px 10px",color:"var(--text)",fontSize:16,outline:"none",fontFamily:"var(--mono)"}}/>
                </div>
              ))}
            </div>
            <button onClick={addManualItem} style={{width:"100%",background:"rgba(0,229,255,0.15)",border:"1px solid rgba(0,229,255,0.3)",borderRadius:12,padding:"11px",fontWeight:800,fontSize:14,color:"var(--cyan)",cursor:"pointer",fontFamily:"var(--font)"}}>+ Ajouter entrée manuelle</button>
          </div>
        ):(
          <button onClick={()=>setActiveManualSlot(activeSlot)} style={{width:"100%",background:"rgba(0,229,255,0.04)",border:"1px dashed rgba(0,229,255,0.2)",borderRadius:12,padding:"9px",color:"var(--cyan)",cursor:"pointer",fontSize:12,fontWeight:600,marginBottom:8,fontFamily:"var(--font)"}}>✏️ Saisie manuelle (kcal + macros)</button>
        )}

        <input ref={searchRef} value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="🔍 Chercher un aliment…"
          style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:14,padding:"12px 16px",color:"var(--text)",fontSize:16,outline:"none",boxSizing:"border-box",marginBottom:8,fontFamily:"var(--font)"}}/>
        {sq&&(
          <div style={{background:"var(--bg2)",borderRadius:14,border:"1px solid var(--border)",marginBottom:10,maxHeight:200,overflowY:"auto"}}>
            {filtered.length===0&&<div style={{padding:"14px 16px",fontSize:13,color:"var(--text3)"}}>Aucun résultat</div>}
            {filtered.map(f=>(
              <div key={f.id} onClick={()=>selectFood(f)} style={{padding:"10px 14px",cursor:"pointer",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",background:pendingFood?.id===f.id?"rgba(168,255,120,0.06)":"transparent",transition:"background 0.1s"}}>
                <div><div style={{fontSize:13,fontWeight:600}}>{f.name}</div><div style={{fontSize:10,color:"var(--text3)"}}>{f.cat}</div></div>
                <div style={{fontSize:11,color:"var(--text3)",fontFamily:"var(--mono)"}}>{f.kcal}/100{f.defaultUnit==="ml"?"ml":"g"}</div>
              </div>
            ))}
          </div>
        )}
        {pendingFood&&(
          <div style={{background:"rgba(168,255,120,0.04)",border:"1px solid rgba(168,255,120,0.15)",borderRadius:18,padding:14,marginBottom:12,animation:"fadeUp 0.2s ease"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{fontWeight:700,fontSize:13}}>{pendingFood.name}</span>
              <button onClick={()=>setPendingFood(null)} style={{background:"none",border:"none",color:"var(--text3)",fontSize:18,cursor:"pointer"}}>✕</button>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <input type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="Quantité" autoFocus
                style={{flex:1,background:"rgba(255,255,255,0.07)",border:"1px solid var(--border2)",borderRadius:12,padding:"10px 14px",color:"var(--text)",fontSize:16,outline:"none",fontFamily:"var(--font)"}}/>
              <select value={unit} onChange={e=>setUnit(e.target.value)}
                style={{background:"var(--bg2)",border:"1px solid var(--border2)",borderRadius:12,padding:"10px 12px",color:"var(--text)",fontSize:13,outline:"none",minWidth:80,fontFamily:"var(--font)"}}>
                {pendingFood.units.map(u=>(
                  <option key={u} value={u} style={{background:"var(--bg2)"}}>{unitLabel(u,pendingFood)}</option>
                ))}
              </select>
            </div>
            {preview&&preview.kcal>0&&(
              <div style={{background:"rgba(255,255,255,0.04)",borderRadius:10,padding:"8px 12px",marginBottom:10}}>
                <MacroBadge kcal={preview.kcal} prot={preview.prot} carbs={preview.carbs} fat={preview.fat}/>
              </div>
            )}
            <button onClick={addItem} className="btn-green" style={{width:"100%",padding:"12px",borderRadius:12,fontSize:14}}>+ Ajouter à {slot.label}</button>
          </div>
        )}
        {!sq&&!pendingFood&&activeManualSlot!==activeSlot&&cats.map(cat=>(
          <div key={cat} style={{marginBottom:14}}>
            <div style={{fontSize:10,fontWeight:700,color:"var(--text3)",marginBottom:8,textTransform:"uppercase",letterSpacing:0.5}}>{cat}</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {allFoods.filter(f=>f.cat===cat).map(f=>(
                <button key={f.id} onClick={()=>selectFood(f)} style={{padding:"6px 12px",borderRadius:20,border:"1px solid var(--border)",background:"var(--glass)",color:"var(--text2)",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"var(--font)",transition:"all 0.15s"}}>{f.name}</button>
              ))}
            </div>
          </div>
        ))}
      </div>
    );
  }

  // ── Overview ──
  return(
    <div style={{padding:"20px 20px 0"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <h2 style={{fontWeight:800,fontSize:22,margin:0}}>📓 Tracking</h2>
        <button onClick={()=>setShowPicker(true)} style={{background:"var(--glass)",border:"1px solid var(--border2)",borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:700,color:"var(--text2)",cursor:"pointer",fontFamily:"var(--font)"}}>📅 {isToday?"Aujourd'hui":formatDate(selectedDay)} ▾</button>
      </div>

      {/* KPI Circles */}
      <div style={{background:isOverride?"rgba(0,229,255,0.04)":"rgba(168,255,120,0.03)",border:`1px solid ${isOverride?"rgba(0,229,255,0.2)":"rgba(168,255,120,0.12)"}`,borderRadius:20,padding:"16px",marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:12,fontWeight:700,color:"var(--text2)"}}>Total du jour</span>
            {isOverride&&<span style={{fontSize:9,color:"var(--cyan)",background:"rgba(0,229,255,0.12)",border:"1px solid rgba(0,229,255,0.3)",borderRadius:8,padding:"1px 7px",fontWeight:700}}>⚙️ Manuel</span>}
          </div>
          <div style={{display:"flex",gap:6}}>
            {isOverride&&<button onClick={resetOverride} style={{background:"rgba(255,95,109,0.08)",border:"1px solid rgba(255,95,109,0.2)",borderRadius:8,padding:"4px 10px",color:"var(--red)",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"var(--font)"}}>↺ Reset</button>}
            <button onClick={()=>{setOverrideForm({kcal:totalKcal,prot:totalProt,carbs:totalCarbs,fat:totalFat});setShowOverride(!showOverride);}} style={{background:"var(--glass)",border:"1px solid var(--border2)",borderRadius:8,padding:"4px 10px",color:"var(--text2)",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"var(--font)"}}>⚙️ Ajuster</button>
          </div>
        </div>

        {/* Rings row */}
        <div style={{display:"flex",justifyContent:"space-around",alignItems:"center"}}>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
            <NeonRing value={totalKcal} max={TARGET_KCAL} size={90} stroke={8} color={isOverride?"var(--cyan)":"var(--green)"}>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:16,fontWeight:800,fontFamily:"var(--mono)",color:isOverride?"var(--cyan)":"var(--green)"}}>{totalKcal}</div>
                <div style={{fontSize:8,color:"var(--text3)"}}>/{TARGET_KCAL}</div>
              </div>
            </NeonRing>
            <span style={{fontSize:9,color:"var(--text3)",fontWeight:600}}>Calories</span>
          </div>
          {[{v:totalProt,max:TARGET_PROT,l:"Prot.",c:"var(--orange)"},{v:totalCarbs,max:300,l:"Carbs",c:"var(--cyan)"},{v:totalFat,max:80,l:"Lip.",c:"var(--yellow)"}].map(r=>(
            <div key={r.l} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
              <NeonRing value={r.v} max={r.max} size={66} stroke={6} color={isOverride?"rgba(0,229,255,0.6)":r.c}>
                <div style={{textAlign:"center"}}>
                  <div style={{fontSize:12,fontWeight:800,fontFamily:"var(--mono)",color:isOverride?"var(--cyan)":r.c}}>{r.v}g</div>
                </div>
              </NeonRing>
              <span style={{fontSize:9,color:"var(--text3)",fontWeight:600}}>{r.l}</span>
            </div>
          ))}
        </div>

        {/* Override panel */}
        {showOverride&&(
          <div style={{marginTop:14,borderTop:"1px solid var(--border)",paddingTop:14,animation:"fadeUp 0.2s ease"}}>
            <div style={{fontSize:11,color:"var(--text3)",marginBottom:10}}>Saisir les valeurs manuellement (remplace le calcul automatique)</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
              {[{k:"kcal",l:"Calories",c:"var(--green)"},{k:"prot",l:"Protéines (g)",c:"var(--orange)"},{k:"carbs",l:"Glucides (g)",c:"var(--cyan)"},{k:"fat",l:"Lipides (g)",c:"var(--yellow)"}].map(f=>(
                <div key={f.k}>
                  <label style={{fontSize:9,color:f.c,fontWeight:700,textTransform:"uppercase"}}>{f.l}</label>
                  <input type="number" value={overrideForm[f.k]} onChange={e=>setOverrideForm(p=>({...p,[f.k]:e.target.value}))} placeholder="0"
                    style={{display:"block",width:"100%",marginTop:3,background:"rgba(255,255,255,0.06)",border:`1px solid ${f.c}44`,borderRadius:8,padding:"8px 10px",color:"var(--text)",fontSize:16,outline:"none",fontFamily:"var(--mono)"}}/>
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setShowOverride(false)} style={{flex:1,background:"var(--glass)",border:"1px solid var(--border)",borderRadius:10,padding:"9px",color:"var(--text2)",fontWeight:700,cursor:"pointer",fontFamily:"var(--font)"}}>Annuler</button>
              <button onClick={saveOverride} style={{flex:2,background:"var(--cyan)",border:"none",borderRadius:10,padding:"9px",color:"#080b14",fontWeight:800,cursor:"pointer",fontFamily:"var(--font)"}}>✓ Appliquer</button>
            </div>
          </div>
        )}
      </div>

      {MEAL_SLOTS.map(slot=>{
        const items=trackingLog[slot.id]||[];
        const slotKcal=items.reduce((s,it)=>s+it.kcal,0);
        return(
          <GlassCard key={slot.id} style={{marginBottom:10,padding:"14px 16px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:items.length>0?10:0}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:18}}>{slot.emoji}</span>
                <div>
                  <div style={{fontWeight:700,fontSize:13}}>{slot.label}</div>
                  <div style={{fontSize:10,color:"var(--text3)",fontFamily:"var(--mono)"}}>⏰ {slot.time}</div>
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                {items.length>0&&<span style={{fontSize:11,color:"var(--text3)",fontFamily:"var(--mono)"}}>{slotKcal} kcal</span>}
                <button onClick={()=>setActiveSlot(slot.id)} className="btn-green" style={{padding:"6px 12px",borderRadius:10,fontSize:12}}>+ DB</button>
                <button onClick={()=>{setActiveSlot(slot.id);setActiveManualSlot(slot.id);}} style={{background:"rgba(0,229,255,0.1)",border:"1px solid rgba(0,229,255,0.25)",borderRadius:10,padding:"6px 10px",color:"var(--cyan)",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"var(--font)"}}>✏️</button>
              </div>
            </div>
            {items.map(it=>{
              const f=allFoods.find(fd=>fd.id===it.foodId||"custom_"+fd.id===it.foodId);
              return(
                <div key={it.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderTop:"1px solid var(--border)"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <span style={{fontSize:12,color:"var(--text2)"}}>{it.name}</span>
                    {it.isManual&&<span style={{fontSize:9,color:"var(--cyan)",background:"rgba(0,229,255,0.1)",border:"1px solid rgba(0,229,255,0.2)",borderRadius:6,padding:"1px 5px",marginLeft:5}}>Manuel</span>}
                    {!it.isManual&&<span style={{fontSize:10,color:"var(--text3)",marginLeft:6,fontFamily:"var(--mono)"}}>{it.amount} {unitLabel(it.unit,f)}</span>}
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <MacroBadge kcal={it.kcal} prot={it.prot} carbs={it.carbs} fat={it.fat}/>
                    <button onClick={()=>removeItem(slot.id,it.id)} style={{background:"rgba(255,95,109,0.1)",border:"none",borderRadius:6,color:"var(--red)",width:22,height:22,cursor:"pointer",fontSize:13,flexShrink:0}}>✕</button>
                  </div>
                </div>
              );
            })}
          </GlassCard>
        );
      })}
    </div>
  );
}

// ═══════════════════════════════════════════════
// EXERCISE PAGE
// ═══════════════════════════════════════════════
function ExercisePage({log,selectedDay,updateLog,setShowPicker,exStats,saveExStats,programs,setPrograms,profile,dailyLogs}){
  const [tab,setTab]=useState("workout"); // "workout" | "programs" | "cardio"
  const [exSearch,setExSearch]=useState("");
  const [expanded,setExpanded]=useState(null);
  const [showSugg,setShowSugg]=useState(false);
  // Custom exercise modal
  const [showCustomModal,setShowCustomModal]=useState(false);
  const [customForm,setCustomForm]=useState({name:"",muscle:"",sub:""});
  // Program editor
  const [editingProg,setEditingProg]=useState(null); // null | program object
  const [progExSearch,setProgExSearch]=useState("");
  // Cardio — separate variables per field to avoid cross-contamination between cardio types
  const [cardioType,setCardioType]=useState("walk");
  const [cardioDuration,setCardioDuration]=useState("");
  const [cardioSteps,setCardioSteps]=useState("");       // walk only: number of steps
  const [cardioDistance,setCardioDistance]=useState(""); // walk only: km
  const [cardioSpeed,setCardioSpeed]=useState("");       // walk_inc, run, bike: km/h
  const [cardioIncline,setCardioIncline]=useState("");   // walk_inc: %
  const [cardioResistance,setCardioResistance]=useState(""); // bike: resistance level

  const exercises=log.exercises||[];
  const cardioLog=log.cardioLog||[];
  const isToday=selectedDay===todayKey();
  const weightKg=profile?.weight||90;

  function searchEx(q){
    if(!q) return [];
    const ql=q.toLowerCase();
    const muscleExact=EXERCISE_DB.filter(e=>e.muscle.toLowerCase()===ql);
    const muscleStart=EXERCISE_DB.filter(e=>e.muscle.toLowerCase().startsWith(ql)&&!muscleExact.includes(e));
    const nameMatch=EXERCISE_DB.filter(e=>e.name.toLowerCase().includes(ql)&&!muscleExact.includes(e)&&!muscleStart.includes(e));
    return [...muscleExact,...muscleStart,...nameMatch].slice(0,14);
  }
  const suggestions=searchEx(exSearch);
  const progSuggestions=searchEx(progExSearch);

  function addExercise(name,muscle,sub,isCustom=false){
    const id=Date.now();
    updateLog(selectedDay,l=>({...l,exercises:[...(l.exercises||[]),{id,name,muscle:muscle||"",sub:sub||"",sets:[],note:"",unit:"lbs",isCustom}]}));
    setExSearch("");setShowSugg(false);setExpanded(id);
  }
  function addCustomExercise(){
    if(!customForm.name.trim()) return;
    addExercise(customForm.name.trim(),customForm.muscle,customForm.sub,true);
    setCustomForm({name:"",muscle:"",sub:""});
    setShowCustomModal(false);
  }

  function loadProgram(prog){
    const newExercises=prog.exercises.map((name,i)=>{
      const dbEx=EXERCISE_DB.find(e=>e.name===name);
      return {id:Date.now()+i,name,muscle:dbEx?.muscle||"",sub:dbEx?.sub||"",sets:[],note:"",unit:"lbs",isCustom:false};
    });
    updateLog(selectedDay,l=>({...l,exercises:[...(l.exercises||[]),...newExercises],isSportDay:true}));
  }

  // Program editor helpers
  function startEditProg(prog){setEditingProg(JSON.parse(JSON.stringify(prog)));setProgExSearch("");}
  function saveEditProg(){
    if(!editingProg) return;
    setPrograms(prev=>prev.map(p=>p.id===editingProg.id?editingProg:p));
    setEditingProg(null);
  }
  function addExToProg(name){
    if(!editingProg||editingProg.exercises.includes(name)) return;
    setEditingProg(p=>({...p,exercises:[...p.exercises,name]}));
    setProgExSearch("");
  }
  function removeExFromProg(name){setEditingProg(p=>({...p,exercises:p.exercises.filter(e=>e!==name)}));}

  function addSet(id){updateLog(selectedDay,l=>({...l,exercises:l.exercises.map(ex=>ex.id===id?{...ex,sets:[...ex.sets,{reps:"",weight:""}]}:ex)}));}
  function updateSet(id,si,f,v){updateLog(selectedDay,l=>({...l,exercises:l.exercises.map(ex=>ex.id===id?{...ex,sets:ex.sets.map((s,i)=>i===si?{...s,[f]:v}:s)}:ex)}));}
  function deleteSet(id,si){updateLog(selectedDay,l=>({...l,exercises:l.exercises.map(ex=>ex.id===id?{...ex,sets:ex.sets.filter((_,i)=>i!==si)}:ex)}));}
  function deleteEx(id){updateLog(selectedDay,l=>({...l,exercises:l.exercises.filter(ex=>ex.id!==id)}));if(expanded===id)setExpanded(null);}
  function updateNote(id,note){updateLog(selectedDay,l=>({...l,exercises:l.exercises.map(ex=>ex.id===id?{...ex,note}:ex)}));}
  function toggleUnit(id){updateLog(selectedDay,l=>({...l,exercises:l.exercises.map(ex=>ex.id===id?{...ex,unit:ex.unit==="kg"?"lbs":"kg"}:ex)}));}
  function updateExField(id,field,val){updateLog(selectedDay,l=>({...l,exercises:l.exercises.map(ex=>ex.id===id?{...ex,[field]:val}:ex)}));}

  function addCardio(){
    const hasData=cardioDuration||cardioSteps||cardioDistance||cardioSpeed;
    if(!hasData) return;
    const ct=CARDIO_TYPES.find(c=>c.id===cardioType);
    const extra=cardioType==="walk"?{steps:cardioSteps,distance:cardioDistance}:{};
    const kcal=estimateCardioKcal(cardioType,parseFloat(cardioDuration)||0,weightKg,extra);
    const entry={
      id:Date.now(),type:cardioType,label:ct.label,emoji:ct.emoji,
      duration:parseFloat(cardioDuration)||0,
      steps:cardioSteps,distance:cardioDistance, // walk fields
      speed:cardioSpeed,incline:cardioIncline,   // walk_inc/run/bike fields
      resistance:cardioResistance,
      kcal
    };
    updateLog(selectedDay,l=>({...l,cardioLog:[...(l.cardioLog||[]),entry]}));
    setCardioDuration("");setCardioSteps("");setCardioDistance("");
    setCardioSpeed("");setCardioIncline("");setCardioResistance("");
  }
  function removeCardio(id){updateLog(selectedDay,l=>({...l,cardioLog:(l.cardioLog||[]).filter(c=>c.id!==id)}));}

  // Build a merged view of all exercise history from BOTH exStats table AND dailyLogs directly
  // This catches sessions logged before the exStats feature existed (or not yet collapsed)
  const allExHistory = useMemo(()=>{
    const map = {}; // exercise_name → [{date, max_weight, total_volume}]
    // Source 1: exStats table (saved when user collapses an exercise)
    exStats.forEach(s=>{
      if(!map[s.exercise_name]) map[s.exercise_name]=[];
      map[s.exercise_name].push({date:s.date,max_weight:s.max_weight||0,total_volume:s.total_volume||0});
    });
    // Source 2: dailyLogs directly — catches ALL sessions regardless of whether they were collapsed
    Object.entries(dailyLogs||{}).forEach(([date,dayLog])=>{
      (dayLog.exercises||[]).forEach(ex=>{
        if(!ex.name||!ex.sets?.length) return;
        const unit=ex.unit||"lbs";
        const weights=ex.sets.map(s=>{const w=parseFloat(s.weight)||0;return unit==="kg"?w*KG_TO_LBS:w;}).filter(w=>w>0);
        if(weights.length===0) return;
        const maxW=Math.max(...weights);
        const vol=ex.sets.reduce((s,st)=>{const r=parseInt(st.reps)||0,w=parseFloat(st.weight)||0;return s+r*(unit==="kg"?w*KG_TO_LBS:w);},0);
        if(!map[ex.name]) map[ex.name]=[];
        // Add if not already covered by exStats for this exact date
        if(!map[ex.name].find(e=>e.date===date)){
          map[ex.name].push({date,max_weight:maxW,total_volume:vol});
        }
      });
    });
    return map;
  },[exStats, dailyLogs]);

  function getPR(name){
    const sessions=allExHistory[name];
    if(!sessions||sessions.length===0) return null;
    return Math.max(...sessions.map(s=>s.max_weight||0));
  }
  function getLastSession(name){
    const sessions=allExHistory[name];
    if(!sessions||sessions.length===0) return null;
    return [...sessions].filter(s=>s.date!==selectedDay).sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
  }
  function handleCollapse(ex){
    if(expanded===ex.id){
      setExpanded(null);
      const unit=ex.unit||"lbs";
      const maxW=Math.max(...ex.sets.map(s=>{const w=parseFloat(s.weight)||0;return unit==="kg"?w*KG_TO_LBS:w;}),0);
      const vol=ex.sets.reduce((s,st)=>{const r=parseInt(st.reps)||0,w=parseFloat(st.weight)||0;return s+r*(unit==="kg"?w*KG_TO_LBS:w);},0);
      if(maxW>0) saveExStats({exercise_name:ex.name,date:selectedDay,max_weight:maxW,total_volume:vol,sets_data:ex.sets});
    } else setExpanded(ex.id);
  }

  const estimatedKcal=estimateStrengthKcal(exercises,weightKg);
  const totalCardioKcal=cardioLog.reduce((s,c)=>s+c.kcal,0);
  const ct=CARDIO_TYPES.find(c=>c.id===cardioType);

  // ── Program editor modal ──
  if(editingProg) return(
    <div style={{padding:"20px 20px 0"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
        <button onClick={()=>setEditingProg(null)} style={{background:"var(--glass)",border:"1px solid var(--border)",borderRadius:12,color:"var(--text)",padding:"8px 14px",cursor:"pointer",fontWeight:700,fontSize:13,fontFamily:"var(--font)"}}>← Annuler</button>
        <h3 style={{margin:0,fontWeight:800,fontSize:17,flex:1}}>{editingProg.emoji} {editingProg.label}</h3>
        <button onClick={saveEditProg} style={{background:"var(--green)",border:"none",borderRadius:12,color:"#080b14",padding:"8px 16px",cursor:"pointer",fontWeight:800,fontSize:13,fontFamily:"var(--font)"}}>✓ Sauver</button>
      </div>

      {/* Muscle tag */}
      <GlassCard style={{marginBottom:14,padding:14}}>
        <div style={{fontSize:10,fontWeight:700,color:"var(--text3)",marginBottom:8,textTransform:"uppercase",letterSpacing:0.5}}>🏷 Tag musculaire</div>
        <input value={editingProg.muscleTag||""} onChange={e=>setEditingProg(p=>({...p,muscleTag:e.target.value}))}
          placeholder="Ex: Back & Triceps, Upper Body, Full Body…"
          style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"9px 12px",color:"var(--text)",fontSize:13,outline:"none",boxSizing:"border-box",fontFamily:"var(--font)",marginBottom:8}}/>
        <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
          {MUSCLE_TAG_SUGGESTIONS.map(tag=>(
            <button key={tag} onClick={()=>setEditingProg(p=>({...p,muscleTag:tag}))} style={{padding:"4px 10px",borderRadius:20,border:`1px solid ${editingProg.muscleTag===tag?"var(--green)":"var(--border)"}`,background:editingProg.muscleTag===tag?"rgba(168,255,120,0.12)":"transparent",color:editingProg.muscleTag===tag?"var(--green)":"var(--text3)",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"var(--font)"}}>{tag}</button>
          ))}
        </div>
      </GlassCard>

      {/* Current exercises */}
      <GlassCard style={{marginBottom:14,padding:14}}>
        <div style={{fontSize:10,fontWeight:700,color:"var(--text3)",marginBottom:10,textTransform:"uppercase",letterSpacing:0.5}}>Exercices ({editingProg.exercises.length})</div>
        {editingProg.exercises.map((name,i)=>{
          const dbEx=EXERCISE_DB.find(e=>e.name===name);
          return(
            <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid var(--border)"}}>
              <div>
                <span style={{fontSize:12,fontWeight:600}}>{name}</span>
                {dbEx?.muscle&&<span style={{fontSize:10,color:"var(--text3)",marginLeft:6}}>{dbEx.muscle}{dbEx.sub?` · ${dbEx.sub}`:""}</span>}
              </div>
              <button onClick={()=>removeExFromProg(name)} style={{background:"rgba(255,95,109,0.1)",border:"none",borderRadius:6,color:"var(--red)",width:24,height:24,cursor:"pointer",fontSize:13}}>✕</button>
            </div>
          );
        })}
      </GlassCard>

      {/* Add exercise to program */}
      <div style={{position:"relative",marginBottom:8}}>
        <input value={progExSearch} onChange={e=>setProgExSearch(e.target.value)}
          placeholder="Ajouter un exercice au programme…"
          style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:12,padding:"11px 14px",color:"var(--text)",fontSize:13,outline:"none",boxSizing:"border-box",fontFamily:"var(--font)"}}/>
        {progExSearch&&progSuggestions.length>0&&(
          <div style={{position:"absolute",top:"100%",left:0,right:0,background:"var(--bg2)",borderRadius:12,border:"1px solid var(--border)",zIndex:10,maxHeight:200,overflowY:"auto",marginTop:4}}>
            {progSuggestions.map((ex,i)=>(
              <div key={i} onClick={()=>addExToProg(ex.name)} style={{padding:"10px 14px",cursor:"pointer",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",opacity:editingProg.exercises.includes(ex.name)?0.4:1}}>
                <div>
                  <span style={{fontSize:13,fontWeight:600}}>{ex.name}</span>
                  {ex.sub&&<span style={{fontSize:10,color:"var(--text3)",marginLeft:6}}>{ex.sub}</span>}
                </div>
                <Tag color={MUSCLE_GROUPS[ex.muscle]?.color||"var(--text3)"}>{ex.muscle}</Tag>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );

  // ── Custom exercise modal ──
  if(showCustomModal) return(
    <div style={{padding:"20px 20px 0"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
        <button onClick={()=>setShowCustomModal(false)} style={{background:"var(--glass)",border:"1px solid var(--border)",borderRadius:12,color:"var(--text)",padding:"8px 14px",cursor:"pointer",fontWeight:700,fontSize:13,fontFamily:"var(--font)"}}>← Retour</button>
        <h3 style={{margin:0,fontWeight:800,fontSize:17}}>✏️ Exercice personnalisé</h3>
      </div>
      <GlassCard style={{padding:16}}>
        {[{k:"name",l:"Nom de l'exercice *",p:"Ex: Incline Smith Press"},{k:"muscle",l:"Groupe musculaire",p:"Ex: Chest, Back, Biceps…"},{k:"sub",l:"Partie du muscle (optionnel)",p:"Ex: Long Head, Short Head, Lateral…"}].map(f=>(
          <div key={f.k} style={{marginBottom:12}}>
            <label style={{fontSize:10,fontWeight:700,color:"var(--text3)",textTransform:"uppercase",letterSpacing:0.5}}>{f.l}</label>
            <input value={customForm[f.k]} onChange={e=>setCustomForm(p=>({...p,[f.k]:e.target.value}))} placeholder={f.p}
              style={{display:"block",width:"100%",marginTop:4,background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"10px 12px",color:"var(--text)",fontSize:13,outline:"none",boxSizing:"border-box",fontFamily:"var(--font)"}}/>
          </div>
        ))}
        <div style={{background:"rgba(168,255,120,0.06)",border:"1px solid rgba(168,255,120,0.15)",borderRadius:10,padding:"8px 12px",marginBottom:14,fontSize:11,color:"var(--text3)"}}>
          💡 Cet exercice sera marqué <span style={{color:"var(--green)",fontWeight:700}}>Custom</span> pour le distinguer des exercices de la base de données
        </div>
        <button onClick={addCustomExercise} disabled={!customForm.name.trim()} style={{width:"100%",background:customForm.name.trim()?"var(--green)":"rgba(168,255,120,0.3)",border:"none",borderRadius:12,padding:"12px",fontWeight:800,fontSize:14,color:"#080b14",cursor:"pointer",fontFamily:"var(--font)"}}>+ Ajouter à la séance</button>
      </GlassCard>
    </div>
  );

  return(
    <div style={{padding:"20px 20px 0"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <h2 style={{fontWeight:800,fontSize:22,margin:0}}>🏋️ Exercices</h2>
        <button onClick={()=>setShowPicker(true)} style={{background:"var(--glass)",border:"1px solid var(--border2)",borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:700,color:"var(--text2)",cursor:"pointer",fontFamily:"var(--font)"}}>📅 {isToday?"Aujourd'hui":formatDate(selectedDay)} ▾</button>
      </div>

      {/* Tab bar */}
      <div style={{display:"flex",gap:6,marginBottom:14,background:"rgba(255,255,255,0.04)",borderRadius:14,padding:4}}>
        {[["workout","🏋️ Séance"],["programs","📋 Programmes"],["cardio","🏃 Cardio"]].map(([t,l])=>(
          <button key={t} onClick={()=>setTab(t)} style={{flex:1,padding:"8px 4px",border:"none",borderRadius:10,fontWeight:700,fontSize:12,cursor:"pointer",background:tab===t?"var(--green)":"transparent",color:tab===t?"#080b14":"var(--text2)",transition:"all 0.2s",fontFamily:"var(--font)"}}>{l}</button>
        ))}
      </div>

      {/* ── WORKOUT TAB ── */}
      {tab==="workout"&&<>
        <RestTimer/>

        {/* Calorie estimate */}
        {(estimatedKcal>0||totalCardioKcal>0)&&(
          <GlassCard style={{marginBottom:12,padding:"12px 14px",display:"flex",gap:10,alignItems:"center"}}>
            <span style={{fontSize:20}}>🔥</span>
            <div style={{flex:1}}>
              <div style={{fontSize:12,fontWeight:700,color:"var(--text2)"}}>Calories brûlées estimées</div>
              <div style={{fontSize:10,color:"var(--text3)"}}>Musculation HIIT + Cardio</div>
            </div>
            <div style={{textAlign:"right"}}>
              {estimatedKcal>0&&<div style={{fontSize:15,fontWeight:800,color:"var(--orange)",fontFamily:"var(--mono)"}}>{estimatedKcal} kcal 💪</div>}
              {totalCardioKcal>0&&<div style={{fontSize:13,fontWeight:700,color:"var(--cyan)",fontFamily:"var(--mono)"}}>{totalCardioKcal} kcal 🏃</div>}
            </div>
          </GlassCard>
        )}

        {/* Search */}
        <div style={{position:"relative",marginBottom:8}}>
          <input value={exSearch} onChange={e=>{setExSearch(e.target.value);setShowSugg(true);}} onFocus={()=>setShowSugg(true)}
            placeholder="Chercher exercice ou muscle (ex: back, chest)…"
            style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:14,padding:"12px 16px",color:"var(--text)",fontSize:13,outline:"none",boxSizing:"border-box",fontFamily:"var(--font)"}}/>
          {showSugg&&suggestions.length>0&&(
            <div style={{position:"absolute",top:"100%",left:0,right:0,background:"var(--bg2)",borderRadius:14,border:"1px solid var(--border)",zIndex:10,maxHeight:240,overflowY:"auto",marginTop:4,boxShadow:"0 8px 32px rgba(0,0,0,0.4)"}}>
              {suggestions.map((ex,i)=>{
                const pr=getPR(ex.name);
                const last=getLastSession(ex.name);
                return(
                <div key={i} onClick={()=>addExercise(ex.name,ex.muscle,ex.sub||"",false)} style={{padding:"10px 14px",cursor:"pointer",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600}}>{ex.name}</div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:2}}>
                      {ex.sub&&<span style={{fontSize:10,color:"var(--text3)"}}>· {ex.sub}</span>}
                      {last&&<span style={{fontSize:10,color:"var(--cyan)",fontFamily:"var(--mono)"}}>Dernière fois: {last.max_weight?.toFixed(0)} lbs ({formatDate(last.date)})</span>}
                      {pr&&<span style={{fontSize:10,color:"var(--yellow)",fontFamily:"var(--mono)"}}>PR: {pr.toFixed(0)} lbs</span>}
                    </div>
                  </div>
                  <Tag color={MUSCLE_GROUPS[ex.muscle]?.color||"var(--text3)"}>{ex.muscle}</Tag>
                </div>
                );
              })}
            </div>
          )}
        </div>
        <button onClick={()=>setShowCustomModal(true)} style={{width:"100%",background:"rgba(255,255,255,0.04)",border:"1px dashed rgba(255,255,255,0.15)",borderRadius:12,padding:"10px",color:"var(--text3)",cursor:"pointer",fontSize:12,fontWeight:600,marginBottom:16,fontFamily:"var(--font)"}}>✏️ Ajouter un exercice personnalisé</button>

        {exercises.length===0&&<div style={{textAlign:"center",color:"var(--text3)",fontSize:14,padding:"30px 0"}}>{isToday?"🏋️ Lance ta séance !":"Aucun exercice ce jour-là"}</div>}

          const unit=ex.unit||"lbs";
          const totalVol=ex.sets.reduce((s,st)=>{const r=parseInt(st.reps)||0,w=parseFloat(st.weight)||0;return s+r*(unit==="kg"?w*KG_TO_LBS:w);},0);
          const maxW=Math.max(...ex.sets.map(s=>{const w=parseFloat(s.weight)||0;return unit==="kg"?w*KG_TO_LBS:w;}),0);
          const pr=getPR(ex.name);
          const isNewPR=maxW>0&&(!pr||maxW>pr);
          const last=getLastSession(ex.name);
          const muscleColor=MUSCLE_GROUPS[ex.muscle]?.color||"var(--text3)";
          return(
            <div key={ex.id} style={{background:"var(--glass)",border:`1px solid ${expanded===ex.id?"rgba(168,255,120,0.2)":"var(--border)"}`,borderRadius:20,marginBottom:12,overflow:"visible",transition:"all 0.2s"}}>
              <div style={{display:"flex",alignItems:"center",padding:"14px 16px",cursor:"pointer",gap:10}} onClick={()=>handleCollapse(ex)}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:14,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>

                    {isNewPR&&<span style={{fontSize:9,background:"rgba(255,209,102,0.15)",color:"var(--yellow)",border:"1px solid rgba(255,209,102,0.3)",borderRadius:8,padding:"1px 6px",fontFamily:"var(--mono)"}}>🏆 NEW PR</span>}
                  </div>
                  <div style={{fontSize:11,color:"var(--text3)",display:"flex",gap:6,marginTop:2,flexWrap:"wrap"}}>
                    {ex.muscle&&<Tag color={muscleColor}>{ex.muscle}{ex.sub?` · ${ex.sub}`:""}</Tag>}
                    <span style={{fontFamily:"var(--mono)"}}>{ex.sets.length} série(s) · {ex.sets.reduce((s,st)=>s+(parseInt(st.reps)||0),0)} reps</span>
                    {totalVol>0&&<span style={{color:"var(--green)",fontFamily:"var(--mono)"}}>· {Math.round(totalVol)} lbs</span>}
                  </div>
                  {pr&&!isNewPR&&<div style={{fontSize:10,color:"var(--yellow)",marginTop:2,fontFamily:"var(--mono)"}}>PR: {pr.toFixed(0)} lbs</div>}
                  {last&&<div style={{fontSize:10,color:"var(--text3)",marginTop:1,fontFamily:"var(--mono)"}}>Dernière fois: {formatDate(last.date)} · max {(last.max_weight||0).toFixed(0)} lbs</div>}
                </div>
                <div onClick={e=>{e.stopPropagation();toggleUnit(ex.id);}} style={{background:unit==="kg"?"rgba(255,209,102,0.12)":"rgba(0,229,255,0.1)",border:`1px solid ${unit==="kg"?"rgba(255,209,102,0.3)":"rgba(0,229,255,0.2)"}`,borderRadius:10,padding:"4px 10px",fontSize:10,fontWeight:700,color:unit==="kg"?"var(--yellow)":"var(--cyan)",cursor:"pointer",fontFamily:"var(--mono)",flexShrink:0}}>{unit.toUpperCase()}</div>
                <span style={{fontSize:16,color:"var(--text3)"}}>{expanded===ex.id?"▾":"▸"}</span>
                <button onClick={e=>{e.stopPropagation();deleteEx(ex.id);}} style={{background:"rgba(255,95,109,0.1)",border:"none",borderRadius:8,color:"var(--red)",padding:"5px 9px",cursor:"pointer",fontSize:12,flexShrink:0}}>✕</button>
              </div>
              {expanded===ex.id&&(
                <div style={{padding:"0 16px 16px",borderTop:"1px solid var(--border)"}}>
                  {/* Editable muscle/sub for custom exercises */}
                  {ex.isCustom&&(
                    <div style={{display:"flex",gap:8,marginTop:12,marginBottom:8}}>
                      <input value={ex.muscle||""} onChange={e=>updateExField(ex.id,"muscle",e.target.value)} placeholder="Muscle (ex: Chest)"
                        style={{flex:1,background:"rgba(255,255,255,0.05)",border:"1px solid var(--border)",borderRadius:8,padding:"6px 10px",color:"var(--text)",fontSize:12,outline:"none",fontFamily:"var(--font)"}}/>
                      <input value={ex.sub||""} onChange={e=>updateExField(ex.id,"sub",e.target.value)} placeholder="Partie (optionnel)"
                        style={{flex:1,background:"rgba(255,255,255,0.05)",border:"1px solid var(--border)",borderRadius:8,padding:"6px 10px",color:"var(--text)",fontSize:12,outline:"none",fontFamily:"var(--font)"}}/>
                    </div>
                  )}
                  <div style={{display:"flex",gap:4,fontSize:9,color:"var(--text3)",fontWeight:700,marginBottom:8,marginTop:12,textTransform:"uppercase",letterSpacing:0.5,fontFamily:"var(--mono)"}}>
                    <div style={{width:32,flexShrink:0}}>S</div><div style={{flex:1}}>REPS</div><div style={{flex:1}}>POIDS ({unit})</div><div style={{width:26,flexShrink:0}}></div>
                  </div>
                  {ex.sets.map((set,si)=>{
                    const w=parseFloat(set.weight)||0;
                    const lbsNote=w&&unit==="kg"?`= ${(w*KG_TO_LBS).toFixed(1)} lbs`:"";
                    return(
                      <div key={si} style={{marginBottom:6}}>
                        <div style={{display:"flex",gap:4,alignItems:"center",width:"100%"}}>
                          <div style={{width:32,flexShrink:0,fontSize:11,color:"var(--green)",fontWeight:700,fontFamily:"var(--mono)"}}>S{si+1}</div>
                          <input type="number" value={set.reps} onChange={e=>updateSet(ex.id,si,"reps",e.target.value)} placeholder="10"
                            style={{flex:1,minWidth:0,background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"8px 8px",color:"var(--text)",fontSize:16,outline:"none",fontFamily:"var(--mono)",textAlign:"center"}}/>
                          <input type="number" value={set.weight} onChange={e=>updateSet(ex.id,si,"weight",e.target.value)} placeholder={unit}
                            style={{flex:1,minWidth:0,background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"8px 8px",color:"var(--text)",fontSize:16,outline:"none",fontFamily:"var(--mono)",textAlign:"center"}}/>
                          <button onClick={()=>deleteSet(ex.id,si)} style={{width:26,height:34,flexShrink:0,background:"rgba(255,95,109,0.1)",border:"none",borderRadius:8,color:"var(--red)",cursor:"pointer",fontSize:13}}>✕</button>

                <div style={{fontSize:11,color:"var(--text3)",marginTop:2}}>{prog.muscleTag||"—"} · {prog.exercises.length} exercices{prog.createdAt?` · créé ${formatDate(prog.createdAt)}`:""}</div>

      {tab==="cardio"&&<>
        {/* Type selector */}
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {CARDIO_TYPES.map(c=>(
            <button key={c.id} onClick={()=>setCardioType(c.id)} style={{flex:1,padding:"10px 4px",borderRadius:14,border:`2px solid ${cardioType===c.id?"var(--green)":"var(--border)"}`,background:cardioType===c.id?"rgba(168,255,120,0.1)":"var(--glass)",cursor:"pointer",fontFamily:"var(--font)",transition:"all 0.15s"}}>

              <div style={{fontSize:10,fontWeight:700,color:cardioType===c.id?"var(--green)":"var(--text3)",marginTop:3}}>{c.label}</div>
            </button>
          ))}
        </div>

        {/* Inputs */}
        <GlassCard style={{marginBottom:14,padding:14}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:100}}>
              <label style={{fontSize:10,color:"var(--text3)",fontWeight:700,textTransform:"uppercase"}}>Durée (min){cardioType!=="walk"?" *":""}</label>
              <input type="number" value={cardioDuration} onChange={e=>setCardioDuration(e.target.value)} placeholder="30"
                style={{display:"block",width:"100%",marginTop:4,background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"9px 12px",color:"var(--text)",fontSize:16,outline:"none",fontFamily:"var(--mono)"}}/>
            </div>
            {/* Walk-specific: steps + distance */}
            {ct?.fields.includes("steps")&&(
              <div style={{flex:1,minWidth:90}}>
                <label style={{fontSize:10,color:"var(--text3)",fontWeight:700,textTransform:"uppercase"}}>Pas</label>
                <input type="number" value={cardioSteps} onChange={e=>setCardioSteps(e.target.value)} placeholder="8000"
                  style={{display:"block",width:"100%",marginTop:4,background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"9px 12px",color:"var(--text)",fontSize:16,outline:"none",fontFamily:"var(--mono)"}}/>
              </div>
            )}
            {ct?.fields.includes("distance")&&(
              <div style={{flex:1,minWidth:90}}>
                <label style={{fontSize:10,color:"var(--text3)",fontWeight:700,textTransform:"uppercase"}}>Distance (km)</label>
                <input type="number" value={cardioDistance} onChange={e=>setCardioDistance(e.target.value)} placeholder="5.0"
                  style={{display:"block",width:"100%",marginTop:4,background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"9px 12px",color:"var(--text)",fontSize:16,outline:"none",fontFamily:"var(--mono)"}}/>
              </div>
            )}
            {/* Other cardio fields */}
            {ct?.fields.includes("speed")&&!ct?.fields.includes("steps")&&(
              <div style={{flex:1,minWidth:90}}>
                <label style={{fontSize:10,color:"var(--text3)",fontWeight:700,textTransform:"uppercase"}}>Vitesse (km/h)</label>
                <input type="number" value={cardioSpeed} onChange={e=>setCardioSpeed(e.target.value)} placeholder="5.5"
                  style={{display:"block",width:"100%",marginTop:4,background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"9px 12px",color:"var(--text)",fontSize:16,outline:"none",fontFamily:"var(--mono)"}}/>
              </div>
            )}
            {ct?.fields.includes("incline")&&!ct?.fields.includes("distance")&&(
              <div style={{flex:1,minWidth:90}}>
                <label style={{fontSize:10,color:"var(--text3)",fontWeight:700,textTransform:"uppercase"}}>Inclinaison (%)</label>
                <input type="number" value={cardioIncline} onChange={e=>setCardioIncline(e.target.value)} placeholder="5"
                  style={{display:"block",width:"100%",marginTop:4,background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"9px 12px",color:"var(--text)",fontSize:16,outline:"none",fontFamily:"var(--mono)"}}/>
              </div>
            )}
            {ct?.fields.includes("resistance")&&(
              <div style={{flex:1,minWidth:90}}>
                <label style={{fontSize:10,color:"var(--text3)",fontWeight:700,textTransform:"uppercase"}}>Résistance</label>
                <input type="number" value={cardioResistance} onChange={e=>setCardioResistance(e.target.value)} placeholder="8"
                  style={{display:"block",width:"100%",marginTop:4,background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"9px 12px",color:"var(--text)",fontSize:16,outline:"none",fontFamily:"var(--mono)"}}/>
              </div>
            )}
          </div>
          {/* Live kcal estimate */}
          {(cardioDuration||cardioSteps||cardioDistance||cardioSpeed)&&(()=>{
            const extra=cardioType==="walk"?{steps:cardioSteps,distance:cardioDistance}:{};
            const kcalPreview=estimateCardioKcal(cardioType,parseFloat(cardioDuration)||0,weightKg,extra);
            if(!kcalPreview) return null;
            return(
              <div style={{marginTop:10,fontSize:12,color:"var(--orange)",fontFamily:"var(--mono)"}}>
                ≈ {kcalPreview} kcal brûlées
                {cardioType==="walk"&&cardioSteps&&<span style={{color:"var(--text3)",fontSize:10,marginLeft:6}}>(basé sur {parseInt(cardioSteps).toLocaleString()} pas)</span>}
                {cardioType==="walk"&&!cardioSteps&&cardioDistance&&<span style={{color:"var(--text3)",fontSize:10,marginLeft:6}}>(basé sur {cardioDistance} km)</span>}
              </div>
            );
          })()}
          <button onClick={addCardio} disabled={!(cardioDuration||cardioSteps||cardioDistance||cardioSpeed)}
            style={{marginTop:12,width:"100%",background:(cardioDuration||cardioSteps||cardioDistance||cardioSpeed)?"var(--green)":"rgba(168,255,120,0.3)",border:"none",borderRadius:12,padding:"11px",fontWeight:800,fontSize:14,color:"#080b14",cursor:"pointer",fontFamily:"var(--font)"}}>+ Logger</button>
        </GlassCard>

        {/* Cardio history for this day */}
        {cardioLog.length>0&&(
          <GlassCard style={{padding:14}}>
            <div style={{fontSize:10,fontWeight:700,color:"var(--text3)",marginBottom:10,textTransform:"uppercase",letterSpacing:0.5}}>Cardio du jour — {totalCardioKcal} kcal</div>
            {cardioLog.map(c=>(
              <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid var(--border)"}}>
                <div>
                  <div style={{fontSize:13,fontWeight:600}}>{c.emoji} {c.label}</div>
                  <div style={{fontSize:10,color:"var(--text3)",fontFamily:"var(--mono)"}}>
                    {c.duration?`${c.duration} min`:""}
                    {c.type==="walk"&&c.steps?` · ${parseInt(c.steps).toLocaleString()} pas`:""}
                    {c.type==="walk"&&c.distance?` · ${c.distance} km`:""}
                    {c.type!=="walk"&&c.speed?` · ${c.speed} km/h`:""}
                    {c.incline?` · ${c.incline}% incl`:""}
                    {c.resistance?` · résist. ${c.resistance}`:""}
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:13,fontWeight:700,color:"var(--orange)",fontFamily:"var(--mono)"}}>{c.kcal} kcal</span>
                  <button onClick={()=>removeCardio(c.id)} style={{background:"rgba(255,95,109,0.1)",border:"none",borderRadius:6,color:"var(--red)",width:24,height:24,cursor:"pointer",fontSize:13}}>✕</button>
                </div>
              </div>
            ))}
          </GlassCard>
        )}
        {cardioLog.length===0&&<div style={{textAlign:"center",color:"var(--text3)",fontSize:13,padding:"30px 0"}}>🏃 Aucun cardio enregistré aujourd'hui</div>}
      </>}
    </div>
  );
}

// ═══════════════════════════════════════════════
// WEEKLY BILAN PAGE
// ═══════════════════════════════════════════════
function WeeklyPage({dailyLogs,exStats,setPage}){
  const today=todayKey();
  const weekStart=getWeekStart(today);

  // Get last 7 days logs
  const last7=Array.from({length:7},(_,i)=>{
    const d=new Date(today+"T12:00:00");d.setDate(d.getDate()-i);
    return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Toronto",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
  }).reverse();

  // Muscles worked this week
  const workedMuscles=new Set();
  const muscleVolume={};
  last7.forEach(day=>{
    const log=dailyLogs[day];
    if(!log) return;
    (log.exercises||[]).forEach(ex=>{
      if(ex.muscle){
        workedMuscles.add(ex.muscle);
        const unit=ex.unit||"lbs";
        const vol=ex.sets.reduce((s,st)=>{const r=parseInt(st.reps)||0,w=parseFloat(st.weight)||0;return s+r*(unit==="kg"?w*KG_TO_LBS:w);},0);
        muscleVolume[ex.muscle]=(muscleVolume[ex.muscle]||0)+vol;
      }
    });
  });

  // Weekly nutrition stats
  const weekKcals=last7.map(day=>{
    const log=dailyLogs[day];if(!log) return 0;
    const mp=buildMealPlan(log.isSportDay!==false,log.proteinKey||"poulet",log.carbKey||"riz");
    const planK=mp.filter(m=>log.meals?.[m.id]).reduce((s,m)=>s+m.kcal,0);
    const trackK=Object.values(log.trackingLog||{}).flat().reduce((s,it)=>s+it.kcal,0);
    return planK+trackK;
  });
  const avgKcal=Math.round(weekKcals.filter(k=>k>0).reduce((s,k)=>s+k,0)/(weekKcals.filter(k=>k>0).length||1));
  const sportDays=last7.filter(d=>dailyLogs[d]?.isSportDay!==false&&dailyLogs[d]).length;
  const totalExercises=last7.reduce((s,d)=>s+(dailyLogs[d]?.exercises?.length||0),0);
  const adherence=last7.filter(d=>dailyLogs[d]).length;

  // PRs this week — read from BOTH exStats and dailyLogs directly
  const weekPRsMap={};
  // From dailyLogs
  last7.forEach(date=>{
    const dayLog=dailyLogs[date];
    if(!dayLog) return;
    (dayLog.exercises||[]).forEach(ex=>{
      if(!ex.sets?.length) return;
      const unit=ex.unit||"lbs";
      const weights=ex.sets.map(s=>{const w=parseFloat(s.weight)||0;return unit==="kg"?w*KG_TO_LBS:w;}).filter(w=>w>0);
      if(!weights.length) return;
      const maxW=Math.max(...weights);
      if(!weekPRsMap[ex.name]||maxW>weekPRsMap[ex.name].max_weight){
        weekPRsMap[ex.name]={exercise_name:ex.name,date,max_weight:maxW};
      }
    });
  });
  // Also from exStats
  exStats.filter(s=>s.date>=last7[0]&&s.date<=today&&s.max_weight>0).forEach(s=>{
    if(!weekPRsMap[s.exercise_name]||s.max_weight>weekPRsMap[s.exercise_name].max_weight){
      weekPRsMap[s.exercise_name]={...s};
    }
  });
  const weekPRs=Object.values(weekPRsMap).sort((a,b)=>b.max_weight-a.max_weight);

  return(

                <div style={{fontSize:10,color:"var(--text3)",fontFamily:"var(--mono)"}}>{formatDate(pr.date)}</div>

      {/* Missing muscle groups */}
      {(() => {
        const allMuscles=Object.keys(MUSCLE_GROUPS).filter(m=>m!=="Full Body");
        const missing=allMuscles.filter(m=>!workedMuscles.has(m));

        );

    </div>
  );

// GRAPH COMPONENTS — proper React components so useState is valid
// ═══════════════════════════════════════════════
function MuscleVolumeGraph({dailyLogs}){
  const muscles=Object.keys(MUSCLE_GROUPS).filter(m=>m!=="Full Body");
  const [selMuscle,setSelMuscle]=useState(muscles[0]);

  const weeks=[];
  for(let w=9;w>=0;w--){
    const d=new Date();d.setDate(d.getDate()-w*7);
    const weekLabel=new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short"}).format(d);
    const weekStart=new Date(d);weekStart.setDate(d.getDate()-d.getDay()+1);
    const weekEnd=new Date(weekStart);weekEnd.setDate(weekStart.getDate()+6);
    const ws=weekStart.toISOString().slice(0,10);
    const we=weekEnd.toISOString().slice(0,10);
    let vol=0;
    Object.entries(dailyLogs).forEach(([date,dayLog])=>{
      if(date<ws||date>we) return;
      (dayLog.exercises||[]).forEach(ex=>{
        const dbEx=EXERCISE_DB.find(e=>e.name===ex.name);
        const exMuscle=ex.muscle||dbEx?.muscle||"";
        if(exMuscle!==selMuscle) return;
        const unit=ex.unit||"lbs";
        vol+=ex.sets.reduce((s,st)=>{const r=parseInt(st.reps)||0,w=parseFloat(st.weight)||0;return s+r*(unit==="kg"?w*KG_TO_LBS:w);},0);
      });
    });
    weeks.push({label:weekLabel,vol:Math.round(vol)});
  }
  const maxVol=Math.max(...weeks.map(w=>w.vol),1);
  const hasData=weeks.some(w=>w.vol>0);
  const muscleColor=MUSCLE_GROUPS[selMuscle]?.color||"var(--green)";

  return(
    <GlassCard style={{marginBottom:14,padding:16}}>
      <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>📊 Volume par groupe musculaire</div>
      <select value={selMuscle} onChange={e=>setSelMuscle(e.target.value)}
        style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"8px 12px",color:"var(--text)",fontSize:14,outline:"none",fontFamily:"var(--font)",marginBottom:14}}>
        {muscles.map(m=><option key={m} value={m} style={{background:"var(--bg2)"}}>{m}</option>)}
      </select>
      {!hasData
        ?<div style={{textAlign:"center",color:"var(--text3)",fontSize:12,padding:"16px 0"}}>Pas encore de données pour {selMuscle}</div>
        :(
          <div style={{display:"flex",gap:4,alignItems:"flex-end",height:80}}>
            {weeks.map((w,i)=>{
              const pct=w.vol/maxVol;
              return(
                <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                  {w.vol>0&&<div style={{fontSize:7,color:"var(--text3)",fontFamily:"var(--mono)"}}>{w.vol>999?`${(w.vol/1000).toFixed(1)}k`:w.vol}</div>}
                  <div style={{width:"100%",height:60,display:"flex",alignItems:"flex-end"}}>
                    <div style={{width:"100%",height:`${Math.max(pct*100,w.vol>0?8:3)}%`,borderRadius:"4px 4px 0 0",background:w.vol>0?muscleColor:"rgba(255,255,255,0.05)",transition:"height 0.4s ease"}}/>
                  </div>
                  <div style={{fontSize:7,color:"var(--text3)",textAlign:"center",lineHeight:1}}>{w.label}</div>
                </div>
              );
            })}
          </div>
        )
      }
      <div style={{fontSize:10,color:"var(--text3)",marginTop:8}}>Volume total (lbs × reps) sur 10 semaines</div>
    </GlassCard>
  );
}

function ExerciseProgressGraph({dailyLogs,exStats}){
  // Build exercise list from ALL sources
  const exNamesFromLogs=[...new Set(Object.values(dailyLogs).flatMap(d=>(d.exercises||[]).map(e=>e.name).filter(Boolean)))].sort();
  const exNames=[...new Set([...exStats.map(s=>s.exercise_name),...exNamesFromLogs])].sort();
  const [selEx,setSelEx]=useState(exNames[0]||"");

  if(exNames.length===0) return(
    <GlassCard style={{marginBottom:28,padding:16}}>
      <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>📈 Progression par exercice</div>
      <div style={{textAlign:"center",color:"var(--text3)",fontSize:12,padding:"16px 0"}}>Enregistre des séances pour voir ta progression</div>
    </GlassCard>
  );

  // Build data from dailyLogs directly (catches all sessions, not just collapsed ones)
  const rawData={};
  Object.entries(dailyLogs).forEach(([date,dayLog])=>{
    (dayLog.exercises||[]).filter(ex=>ex.name===selEx&&ex.sets?.length).forEach(ex=>{
      const unit=ex.unit||"lbs";
      const weights=ex.sets.map(s=>{const w=parseFloat(s.weight)||0;return unit==="kg"?w*KG_TO_LBS:w;}).filter(w=>w>0);
      if(!weights.length) return;
      const maxW=Math.max(...weights);
      if(!rawData[date]||maxW>rawData[date]) rawData[date]=maxW;
    });
  });
  // Merge exStats (may have entries not in logs)
  exStats.filter(s=>s.exercise_name===selEx&&s.max_weight>0).forEach(s=>{
    if(!rawData[s.date]||s.max_weight>rawData[s.date]) rawData[s.date]=s.max_weight;
  });
  const data=Object.entries(rawData).sort((a,b)=>a[0].localeCompare(b[0])).slice(-20).map(([date,max_weight])=>({date,max_weight}));

  const maxW2=Math.max(...data.map(d=>d.max_weight),1);
  const minW2=Math.max(0,Math.min(...data.map(d=>d.max_weight))-10);
  const GW=300,GH=100,GPL=30,GPB=24,GPT=10,GPR=10;
  const gxs=i=>GPL+i*(GW-GPL-GPR)/Math.max(data.length-1,1);
  const gys=v=>GH-GPB-((v-minW2)/(maxW2-minW2||1))*(GH-GPT-GPB);
  const gpts=data.map((d,i)=>`${gxs(i)},${gys(d.max_weight)}`).join(" ");
  const first=data[0]?.max_weight||0, last2=data[data.length-1]?.max_weight||0;
  const diff2=last2-first;

  return(
    <GlassCard style={{marginBottom:28,padding:16}}>
      <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>📈 Progression par exercice</div>
      <select value={selEx} onChange={e=>setSelEx(e.target.value)}
        style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"8px 12px",color:"var(--text)",fontSize:14,outline:"none",fontFamily:"var(--font)",marginBottom:12}}>
        {exNames.map(n=><option key={n} value={n} style={{background:"var(--bg2)"}}>{n}</option>)}
      </select>
      {data.length<2
        ?<div style={{textAlign:"center",color:"var(--text3)",fontSize:12,padding:"12px 0"}}>Besoin d'au moins 2 sessions pour voir la courbe</div>
        :(
          <>
            <div style={{display:"flex",gap:10,marginBottom:12}}>
              {[{l:"Début",v:first.toFixed(0),c:"var(--yellow)"},{l:"Actuel",v:last2.toFixed(0),c:"var(--green)"},{l:"Progression",v:`${diff2>=0?"+":""}${diff2.toFixed(0)}`,c:diff2>=0?"var(--green)":"var(--red)"}].map(s=>(
                <div key={s.l} style={{flex:1,background:"rgba(255,255,255,0.03)",borderRadius:10,padding:"8px 10px",textAlign:"center"}}>
                  <div style={{fontSize:14,fontWeight:800,color:s.c,fontFamily:"var(--mono)"}}>{s.v} lbs</div>
                  <div style={{fontSize:9,color:"var(--text3)"}}>{s.l}</div>
                </div>
              ))}
            </div>
            <svg width="100%" viewBox={`0 0 ${GW} ${GH}`} style={{overflow:"visible"}}>
              <defs>
                <linearGradient id="exg2" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#ffd166" stopOpacity="0.25"/>
                  <stop offset="100%" stopColor="#ffd166" stopOpacity="0"/>
                </linearGradient>
              </defs>
              {[minW2,(minW2+maxW2)/2,maxW2].map((v,i)=>(
                <g key={i}>
                  <line x1={GPL} y1={gys(v)} x2={GW-GPR} y2={gys(v)} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>
                  <text x={GPL-4} y={gys(v)+4} textAnchor="end" fontSize="8" fill="rgba(255,255,255,0.25)" fontFamily="var(--mono)">{v.toFixed(0)}</text>
                </g>
              ))}
              <polygon points={`${gxs(0)},${GH-GPB} ${gpts} ${gxs(data.length-1)},${GH-GPB}`} fill="url(#exg2)"/>
              <polyline points={gpts} fill="none" stroke="#ffd166" strokeWidth="2.5" strokeLinejoin="round" style={{filter:"drop-shadow(0 0 4px rgba(255,209,102,0.6))"}}/>
              {data.map((d,i)=>(
                <g key={i}>
                  <circle cx={gxs(i)} cy={gys(d.max_weight)} r="4" fill="#ffd166" style={{filter:"drop-shadow(0 0 3px rgba(255,209,102,0.8))"}}/>
                  {i%Math.max(1,Math.floor(data.length/5))===0&&<text x={gxs(i)} y={GH-6} textAnchor="middle" fontSize="7" fill="rgba(255,255,255,0.3)" fontFamily="var(--mono)">{formatDate(d.date).slice(0,5)}</text>}
                </g>
              ))}
            </svg>
          </>
        )
      }
    </GlassCard>
  );
}

function ProfilePage({profile,setProfile,weightHistory,setWeightHistory,onSignOut,userEmail,exStats,dailyLogs}){

  const [form,setForm]=useState({...profile});
  const [nw,setNw]=useState("");
  const streak=calcStreak(dailyLogs);

  function save2(){setProfile({...form,weight:parseFloat(form.weight)||profile.weight});setEditing(false);}
  function logW(){const w=parseFloat(nw);if(!w)return;setWeightHistory(p=>[...p.filter(e=>e.date!==todayKey()),{date:todayKey(),weight:w}].sort((a,b)=>a.date.localeCompare(b.date)));setProfile(p=>({...p,weight:w}));setNw("");}

  const diff=profile.weight-(weightHistory[0]?.weight||profile.weight);
  const bmi=(profile.weight/((profile.height/100)**2)).toFixed(1);

  // Weight graph
  const wData=weightHistory.slice(-20);
  const wMin=Math.min(...wData.map(d=>d.weight))-1;
  const wMax=Math.max(...wData.map(d=>d.weight))+1;
  const W=300,H=100,PL=30,PB=20,PT=10,PR=10;
  const xs=i=>PL+i*(W-PL-PR)/Math.max(wData.length-1,1);
  const ys=v=>H-PB-((v-wMin)/(wMax-wMin))*(H-PT-PB);
  const pts=wData.map((d,i)=>`${xs(i)},${ys(d.weight)}`).join(" ");

  // All-time PRs
  const allPRs={};
  exStats.forEach(s=>{if(!allPRs[s.exercise_name]||s.max_weight>allPRs[s.exercise_name].max_weight){allPRs[s.exercise_name]=s;}});
