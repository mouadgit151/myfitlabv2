*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html{
  /* Prevent iOS font size adjustment on orientation change */
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
html,body{
  background:var(--bg);
  overscroll-behavior:none;
  /* Prevent bounce scroll on iOS */
  overscroll-behavior-y:none;
  font-family:var(--font);
  color:var(--text);
  /* Fix iOS momentum scroll */
  -webkit-overflow-scrolling:touch;
  /* Prevent double-tap zoom */
  touch-action:manipulation;
  /* Safe area for notch/home indicator handled by bottom nav */
  height:100%;
}
/* CRITICAL: font-size 16px minimum on ALL inputs prevents iOS auto-zoom */
input,textarea,select{
  font-family:var(--font);
  font-size:16px !important;
  /* Prevent iOS adding inner shadow but keep border-radius from inline styles */
  -webkit-appearance:none;
  appearance:none;
}
button{
  font-family:var(--font);
  /* Prevent iOS styling buttons */
  -webkit-appearance:none;
  /* Better touch target feedback */
  touch-action:manipulation;
}
/* Prevent text selection on UI elements */
button,label{
  -webkit-user-select:none;
  user-select:none;
}
/* Allow text selection in inputs/content */
input,textarea,p,div{
  -webkit-user-select:auto;
  user-select:auto;
}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
::-webkit-scrollbar{display:none;}
select{-webkit-appearance:none;appearance:none;}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(168,255,120,0.2)}50%{box-shadow:0 0 40px rgba(168,255,120,0.5)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes ringPulse{0%{transform:scale(1);opacity:0.6}100%{transform:scale(1.6);opacity:0}}

.fade-up{animation:fadeUp 0.35s cubic-bezier(.22,1,.36,1) both;}
.fade-up-1{animation-delay:0.05s}
.fade-up-2{animation-delay:0.1s}
.fade-up-3{animation-delay:0.15s}
.fade-up-4{animation-delay:0.2s}

.glass{background:var(--glass);border:1px solid var(--border);border-radius:20px;}
.glass2{background:var(--glass2);border:1px solid var(--border2);border-radius:16px;}

.btn-green{background:var(--green);color:#080b14;font-weight:800;border:none;border-radius:14px;cursor:pointer;font-family:var(--font);transition:all 0.2s;}
.btn-green:active{transform:scale(0.96);}

.neon-text{background:linear-gradient(90deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

function getWeekStart(dateKey){
  const d=new Date(dateKey+"T12:00:00");
  const day=d.getDay();
  const diff=day===0?-6:1-day;
  d.setDate(d.getDate()+diff);

}

const CARDIO_TYPES = [
  {id:"walk",      label:"Marche",          emoji:"🚶", met:3.5,  fields:["steps","distance"]},
  {id:"walk_inc",  label:"Marche inclinée", emoji:"⛰️",  met:5.0,  fields:["speed","incline"]},

// Estimate kcal for walking from steps (avg stride ~0.762m, ~0.04 kcal/step for 90kg person)
function estimateWalkKcalFromSteps(steps, weightKg=90){
  if(!steps) return 0;
  const kcalPerStep = weightKg * 0.00045; // roughly 0.04 kcal/step at 90kg
  return Math.round(steps * kcalPerStep);
}
function estimateWalkKcalFromDistance(distKm, weightKg=90){
  if(!distKm) return 0;
  // ~0.6 kcal per kg per km
  return Math.round(distKm * weightKg * 0.6);
}

// Estimate kcal for cardio (MET formula: kcal = MET × weight_kg × hours)
function estimateCardioKcal(type, durationMin, weightKg=90, extra={}){
  if(type==="walk"){
    if(extra.steps) return estimateWalkKcalFromSteps(parseFloat(extra.steps), weightKg);
    if(extra.distance) return estimateWalkKcalFromDistance(parseFloat(extra.distance), weightKg);
  }
  const met=CARDIO_TYPES.find(c=>c.id===type)?.met||5;
  return Math.round(met * weightKg * (durationMin/60));
}

// Estimate kcal for HIIT strength session
// HIIT at max effort: ~8-10 kcal/min + EPOC bonus ~20%
// 2 heavy sets per exercise, max reps = high intensity
function estimateStrengthKcal(exercises, weightKg=90){
  if(!exercises||exercises.length===0) return 0;
  const totalSets=exercises.reduce((s,ex)=>s+ex.sets.length,0);
  if(totalSets===0) return 0;
  // Approx: 0.25 kcal per lb lifted per set + 5 kcal/min rest
  // For HIIT heavy: ~12 kcal/set average + 2min rest between sets
  const setKcal=totalSets*12;
  const restKcal=Math.max(0,totalSets-1)*10; // rest between sets
  return Math.round((setKcal+restKcal)*1.15); // +15% EPOC
}

function calcFoodMacros(food,amount,unit){
  const a=parseFloat(amount)||0;
  if(!a) return {kcal:0,prot:0,carbs:0,fat:0};
  if(unit==="qty"&&food.perQty) return {kcal:Math.round(food.qtyKcal*a),prot:+(food.qtyProt*a).toFixed(1),carbs:+(food.qtyCarbs*a).toFixed(1),fat:+(food.qtyFat*a).toFixed(1)};
  let g=a;
  if(unit==="qty") g=a*(food.qtyG||100);
  else if(unit==="half") g=a*(food.halfG||75);
  else if(unit==="can") g=a*(food.canG||170);
  else if(unit==="tsp") g=a*(food.tspG||5);
  else if(unit==="scoop") g=a*(food.scoopG||30);
  return {kcal:Math.round(g*food.kcal/100),prot:+(g*food.prot/100).toFixed(1),carbs:+(g*food.carbs/100).toFixed(1),fat:+(g*food.fat/100).toFixed(1)};
}
function unitLabel(unit,food){
  if(unit==="qty") return food?.name?.includes("Œuf")||food?.name?.includes("œuf")?"œuf(s)":"unité(s)";
  if(unit==="half") return "½";
  if(unit==="can") return "canne";
  if(unit==="tsp") return "c.thé";
  if(unit==="scoop") return "scoop";
  return unit;
}

// REST TIMER — Persistent (survives lock screen)
// ═══════════════════════════════════════════════
function loadTimerSaved(){try{const r=localStorage.getItem(TIMER_KEY);return r?JSON.parse(r):null;}catch{return null;}}
function saveTimer(endTime,total){try{localStorage.setItem(TIMER_KEY,JSON.stringify({endTime,total}));}catch{}}
function clearTimer(){try{localStorage.removeItem(TIMER_KEY);}catch{}}
function calcRemaining(saved){if(!saved)return 0;return Math.max(0,Math.ceil((saved.endTime-Date.now())/1000));}

function RestTimer(){
  const saved=loadTimerSaved();
  const initRem=calcRemaining(saved);
  const isActive=saved&&initRem>0;
  const [active,setActive]=useState(isActive);
  const [total,setTotal]=useState(saved?.total??90);
  const [remaining,setRemaining]=useState(isActive?initRem:(saved?.total??90));
  const [done,setDone]=useState(!isActive&&saved&&initRem===0);
  const iv=useRef(null);

  function tick(){
    const s=loadTimerSaved();
    if(!s){clearInterval(iv.current);return;}
    const rem=calcRemaining(s);
    setRemaining(rem);
    if(rem<=0){clearInterval(iv.current);clearTimer();setActive(false);setDone(true);}
  }
  function start(sec){
    clearInterval(iv.current);
    const endTime=Date.now()+sec*1000;
    saveTimer(endTime,sec);
    setTotal(sec);setRemaining(sec);setActive(true);setDone(false);
    iv.current=setInterval(tick,500);
  }
  function stop(){clearInterval(iv.current);clearTimer();setActive(false);setDone(false);setRemaining(total);}

  useEffect(()=>{
    if(isActive) iv.current=setInterval(tick,500);
    function onVis(){if(document.visibilityState==="visible")tick();}
    document.addEventListener("visibilitychange",onVis);
    return()=>{clearInterval(iv.current);document.removeEventListener("visibilitychange",onVis);};
  },[]);

  const pct=active?remaining/total:(done?0:1);
  const m=Math.floor(remaining/60),s=remaining%60;
  const size=80,stroke=7,r=(size-stroke)/2,circ=2*Math.PI*r;

  return(
    <div style={{background:"linear-gradient(135deg,rgba(168,255,120,0.05),rgba(0,229,255,0.03))",border:"1px solid rgba(168,255,120,0.12)",borderRadius:20,padding:"16px",marginBottom:16}}>
      <div style={{fontWeight:700,fontSize:12,marginBottom:12,color:"var(--text2)",letterSpacing:1,textTransform:"uppercase"}}>⏱ Rest Timer</div>
      <div style={{display:"flex",alignItems:"center",gap:16}}>
        <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
          <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={stroke}/>
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={done?"var(--red)":active?"var(--green)":"rgba(255,255,255,0.1)"}
              strokeWidth={stroke} strokeDasharray={circ} strokeDashoffset={circ*(1-pct)}
              style={{transition:"stroke-dashoffset 0.4s ease",strokeLinecap:"round"}}/>
          </svg>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column"}}>
            <span style={{fontSize:done?9:14,fontWeight:800,color:done?"var(--red)":active?"var(--green)":"var(--text3)",fontFamily:"var(--mono)",lineHeight:1}}>
              {done?"DONE":active?`${m}:${String(s).padStart(2,"0")}`:"REST"}
            </span>
          </div>
          {active&&<div style={{position:"absolute",inset:-4,borderRadius:"50%",border:`2px solid var(--green)`,opacity:0,animation:"ringPulse 2s ease-out infinite"}}/>}
        </div>
        <div style={{flex:1}}>
          <div style={{display:"flex",gap:5,marginBottom:8}}>
            {[60,90,120,180].map(sec=>(
              <button key={sec} onClick={()=>start(sec)} style={{flex:1,padding:"7px 2px",borderRadius:10,border:`1px solid ${active&&total===sec?"var(--green)":"var(--border)"}`,background:active&&total===sec?"rgba(168,255,120,0.12)":"var(--glass)",color:active&&total===sec?"var(--green)":"var(--text2)",fontWeight:700,cursor:"pointer",fontSize:11,fontFamily:"var(--font)",transition:"all 0.15s"}}>
                {sec===60?"1m":sec===90?"1:30":sec===120?"2m":"3m"}
              </button>
            ))}

          {!active&&!done&&<div style={{fontSize:11,color:"var(--text3)",textAlign:"center"}}>Sélectionne une durée</div>}

      </div>
    </div>
  );
}

function NeonRing({value,max,size=120,stroke=10,color="var(--green)",children}){
  const r=(size-stroke)/2,circ=2*Math.PI*r,pct=Math.min(Math.max(value/(max||1),0),1);
  // Resolve color to a real hex for the drop-shadow filter (CSS vars don't work inside filter)
  const colorMap={"var(--green)":"#a8ff78","var(--cyan)":"#00e5ff","var(--orange)":"#ff9f5a","var(--yellow)":"#ffd166","var(--red)":"#ff5f6d","var(--purple)":"#c084fc","rgba(0,229,255,0.6)":"#00e5ff"};
  const shadowColor=colorMap[color]||color;
  return(
    <div style={{position:"relative",width:size,height:size,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <svg width={size} height={size} style={{position:"absolute",top:0,left:0,transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct)}
          style={{transition:"stroke-dashoffset 0.7s cubic-bezier(.4,0,.2,1)",strokeLinecap:"round",filter:`drop-shadow(0 0 6px ${shadowColor}aa)`}}/>
      </svg>
      <div style={{zIndex:1,textAlign:"center"}}>{children}</div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// STREAK CALCULATOR
// ═══════════════════════════════════════════════
function calcStreak(dailyLogs){
  const keys=Object.keys(dailyLogs).sort().reverse();
  if(keys.length===0) return 0;
  let streak=0;
  const today=todayKey();
  let checkDate=new Date(today+"T12:00:00");
  for(let i=0;i<365;i++){
    const key=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Toronto",year:"numeric",month:"2-digit",day:"2-digit"}).format(checkDate);
    const log=dailyLogs[key];
    // A day counts only if something was actually logged (meals, exercises, tracking, water, supplements)
    const hasActivity=log&&(
      Object.values(log.meals||{}).some(Boolean)||
      (log.exercises||[]).length>0||
      Object.values(log.trackingLog||{}).flat().length>0||
      (log.water||0)>0||
      Object.values(log.supplements||{}).some(Boolean)||
      (log.cardioLog||[]).length>0
    );
    if(hasActivity){
      streak++;
      checkDate.setDate(checkDate.getDate()-1);
    } else {
      // Allow today to not break streak if it's early in the day
      if(i===0){checkDate.setDate(checkDate.getDate()-1);continue;}
      break;
    }
  }
  return streak;
}

function DayPicker({dailyLogs,selectedDay,onSelect,onClose,onCreateDay}){
  const [view,setView]=useState("calendar");
  const [calOffset,setCalOffset]=useState(0); // months offset from current

  const now=new Date();
  const displayMonth=new Date(now.getFullYear(),now.getMonth()+calOffset,1);
  const monthKey=`${displayMonth.getFullYear()}-${String(displayMonth.getMonth()+1).padStart(2,"0")}`;
  const monthLabel=displayMonth.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});

  // Build calendar grid for display month
  function buildMonthGrid(){
    const year=displayMonth.getFullYear(),month=displayMonth.getMonth();
    const firstDay=new Date(year,month,1).getDay();
    const adj=firstDay===0?6:firstDay-1;
    const daysInMonth=new Date(year,month+1,0).getDate();
    const cells=[];
    for(let i=0;i<adj;i++) cells.push(null);
    for(let d=1;d<=daysInMonth;d++){
      cells.push(`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
    }
    return cells;
  }

  const days=Object.keys(dailyLogs).sort().reverse();
  const grid=buildMonthGrid();

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:1000,display:"flex",alignItems:"flex-end",justifyContent:"center",backdropFilter:"blur(8px)"}} onClick={onClose}>

            </div>

            {[["calendar","🗓 Calendrier"],["list","📋 Liste"]].map(([v,l])=>(
              <button key={v} onClick={()=>setView(v)} style={{flex:1,padding:"8px",borderRadius:12,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,background:view===v?"var(--green)":"var(--glass)",color:view===v?"#080b14":"var(--text2)",fontFamily:"var(--font)",transition:"all 0.2s"}}>{l}</button>

                        opacity:isFuture?0.3:1,transition:"all 0.15s"}}>
                      <span style={{fontSize:13,fontWeight:700,color:sel?"#080b14":"var(--text)"}}>{new Date(d+"T12:00:00").getDate()}</span>
                      {hasLog&&<div style={{display:"flex",gap:2,marginTop:2}}>
                        <div style={{width:4,height:4,borderRadius:"50%",background:sel?"#080b14":isSport?"var(--green)":"#78b4ff"}}/>
                      </div>}
                    </div>
                  );
                })}
              </div>
              <div style={{marginTop:14,display:"flex",gap:10,justifyContent:"center"}}>
                {[["var(--green)","Jour sport"],["#78b4ff","Jour repos"],["rgba(168,255,120,0.35)","Aujourd'hui"]].map(([c,l])=>(
                  <div key={l} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"var(--text3)"}}>
                    <div style={{width:8,height:8,borderRadius:"50%",background:c}}/>
                    {l}
                  </div>
                ))}
              </div>
            </>
          )}

          {view==="list"&&(
            <>
              {days.length===0&&<div style={{textAlign:"center",color:"var(--text3)",padding:30}}>Aucun jour enregistré</div>}
              {days.map(d=>{
                const log=dailyLogs[d];
                const mp=buildMealPlan(log.isSportDay!==false,log.proteinKey,log.carbKey);
                const planKcal=mp.filter(m=>log.meals?.[m.id]).reduce((s,m)=>s+m.kcal,0);
                const trackKcal=Object.values(log.trackingLog||{}).flat().reduce((s,it)=>s+it.kcal,0);
                const sel=d===selectedDay,isT=d===todayKey();
                return(
                  <div key={d} onClick={()=>{onSelect(d);onClose();}} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 14px",borderRadius:14,marginBottom:8,cursor:"pointer",background:sel?"rgba(168,255,120,0.08)":"var(--glass)",border:`1px solid ${sel?"rgba(168,255,120,0.35)":"var(--border)"}`,transition:"all 0.15s"}}>
                    <div>
                      <div style={{fontWeight:700,fontSize:13,display:"flex",alignItems:"center",gap:6}}>
                        {isT?"Aujourd'hui":formatDateLong(d)}
                        {isT&&<Tag color="var(--green)">TODAY</Tag>}
                      </div>
                      <div style={{fontSize:11,color:log.isSportDay!==false?"var(--green)":"#78b4ff",marginTop:2}}>
                        {log.isSportDay!==false?"💪 Sport":"😴 Repos"} · {planKcal+trackKcal} kcal
                      </div>
                    </div>
                    <span style={{fontSize:18,color:sel?"var(--green)":"var(--text3)"}}>{sel?"✓":"›"}</span>
                  </div>
                );
              })}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// AUTH SCREEN
// ═══════════════════════════════════════════════
function AuthScreen({onAuth}){
  const [mode,setMode]=useState("login");
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [msg,setMsg]=useState("");
  const [loading,setLoading]=useState(false);
  async function handle(){
    setLoading(true);setMsg("");
    try{
      const res=mode==="login"?await sb.auth.signInWithPassword({email,password:pw}):await sb.auth.signUp({email,password:pw});
      if(res.error)setMsg("❌ "+res.error.message);
      else if(mode==="signup")setMsg("✅ Vérifie ton email pour confirmer !");
      else onAuth(res.data.user);
    }catch(e){setMsg("❌ "+e.message);}
    setLoading(false);
  }
  return(
    <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 24px",position:"relative",overflow:"hidden"}}>
      {/* BG glow */}
      <div style={{position:"absolute",top:"20%",left:"50%",transform:"translateX(-50%)",width:300,height:300,borderRadius:"50%",background:"radial-gradient(circle,rgba(168,255,120,0.06) 0%,transparent 70%)",pointerEvents:"none"}}/>
      <div style={{width:"100%",maxWidth:380,position:"relative",zIndex:1}}>
        <div style={{textAlign:"center",marginBottom:40}}>
          <div style={{fontSize:56,marginBottom:12,filter:"drop-shadow(0 0 20px rgba(168,255,120,0.4))"}}>⚡</div>
          <h1 style={{fontWeight:800,fontSize:32,margin:0,letterSpacing:-1,background:"linear-gradient(135deg,var(--green),var(--cyan))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>My Fit Lab</h1>
          <p style={{color:"var(--text3)",fontSize:13,marginTop:8,fontStyle:"italic",fontFamily:"var(--mono)"}}>// trust the process</p>
        </div>
        <div style={{display:"flex",gap:6,marginBottom:20,background:"rgba(255,255,255,0.04)",borderRadius:16,padding:4}}>
          {["login","signup"].map(m=>(
            <button key={m} onClick={()=>setMode(m)} style={{flex:1,padding:"10px",border:"none",borderRadius:12,fontWeight:700,fontSize:13,cursor:"pointer",background:mode===m?"var(--green)":"transparent",color:mode===m?"#080b14":"var(--text2)",transition:"all 0.2s",fontFamily:"var(--font)"}}>
              {m==="login"?"Se connecter":"Créer un compte"}
            </button>
          ))}
        </div>
        {[{t:"email",p:"Email"},{t:"password",p:"Mot de passe"}].map((f,i)=>(
          <input key={f.t} type={f.t} placeholder={f.p}
            value={i===0?email:pw} onChange={e=>i===0?setEmail(e.target.value):setPw(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&handle()}
            style={{display:"block",width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:14,padding:"14px 18px",color:"var(--text)",fontSize:15,outline:"none",marginBottom:10,boxSizing:"border-box",fontFamily:"var(--font)",transition:"border-color 0.2s"}}/>
        ))}
        <button onClick={handle} disabled={loading} style={{width:"100%",background:loading?"rgba(168,255,120,0.4)":"var(--green)",border:"none",borderRadius:14,padding:"15px",fontWeight:800,fontSize:16,color:"#080b14",cursor:"pointer",marginTop:4,fontFamily:"var(--font)",boxShadow:"0 0 30px rgba(168,255,120,0.25)",transition:"all 0.2s"}}>
          {loading?"Chargement…":mode==="login"?"Se connecter →":"Créer mon compte →"}
        </button>
        {msg&&<div style={{marginTop:14,textAlign:"center",fontSize:13,color:msg.startsWith("✅")?"var(--green)":"var(--red)",background:"rgba(255,255,255,0.04)",borderRadius:12,padding:"10px 16px",border:"1px solid var(--border)"}}>{msg}</div>}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// HOME PAGE
// ═══════════════════════════════════════════════
function HomePage({log,setPage,profile,updateLog,dailyLogs,exStats}){
  const mp=buildMealPlan(log.isSportDay!==false,log.proteinKey||"poulet",log.carbKey||"riz");
  const planKcal=mp.reduce((s,m)=>log.meals?.[m.id]?s+m.kcal:s,0);
  const planProt=mp.reduce((s,m)=>log.meals?.[m.id]?s+m.prot:s,0);
  const trackItems=Object.values(log.trackingLog||{}).flat();
  const trackKcal=trackItems.reduce((s,it)=>s+it.kcal,0);
  const trackProt=trackItems.reduce((s,it)=>s+it.prot,0);
  const totalKcal=planKcal+trackKcal;
  const totalProt=Math.round(planProt+trackProt);
  const TARGET_KCAL=log.isSportDay!==false?2100:1950;
  const TARGET_PROT=190;
  const streak=calcStreak(dailyLogs);
  const supps=Object.values(log.supplements||{}).filter(Boolean).length;

  // Last 7 days quick stats
  const last7=Array.from({length:7},(_,i)=>{
    const d=new Date();d.setDate(d.getDate()-i);
    return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Toronto",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
  }).reverse();
  const activeDays=last7.filter(d=>dailyLogs[d]).length;
  const weekExercises=last7.reduce((s,d)=>s+(dailyLogs[d]?.exercises?.length||0),0);

  return(
    <div style={{padding:"20px 20px 0",animation:"fadeUp 0.3s ease"}}>
      {/* Header greeting */}
      <div style={{marginBottom:24}}>
        <div style={{fontSize:11,color:"var(--text3)",letterSpacing:1,textTransform:"uppercase",fontFamily:"var(--mono)",marginBottom:4}}>
          {new Date().toLocaleDateString("fr-FR",{timeZone:"America/Toronto",weekday:"long",day:"numeric",month:"long"})}
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <h2 style={{fontSize:24,fontWeight:800,margin:0,lineHeight:1.1}}>Bonjour, {profile.name} 👋</h2>
            <div style={{fontSize:13,color:"var(--text2)",marginTop:4,fontStyle:"italic"}}>"{profile.quote||"Trust the process"}"</div>
          </div>
          {streak>0&&(
            <div style={{background:"linear-gradient(135deg,rgba(255,159,90,0.15),rgba(255,95,109,0.1))",border:"1px solid rgba(255,159,90,0.3)",borderRadius:16,padding:"10px 14px",textAlign:"center",flexShrink:0}}>
              <div style={{fontSize:22}}>🔥</div>
              <div style={{fontSize:18,fontWeight:800,color:"var(--orange)",fontFamily:"var(--mono)",lineHeight:1}}>{streak}</div>
              <div style={{fontSize:9,color:"var(--text3)",marginTop:1}}>streak</div>
            </div>
          )}
        </div>
      </div>

      {/* Main KPI ring */}
      <div style={{display:"flex",justifyContent:"center",marginBottom:20}}>
        <div style={{position:"relative"}}>
          <NeonRing value={totalKcal} max={TARGET_KCAL} size={160} stroke={13} color="var(--green)">
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:30,fontWeight:800,fontFamily:"var(--mono)",lineHeight:1,background:"linear-gradient(135deg,var(--green),var(--cyan))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{totalKcal}</div>
              <div style={{fontSize:10,color:"var(--text3)",marginTop:2}}>/ {TARGET_KCAL} kcal</div>
            </div>
          </NeonRing>
          {/* Small rings */}
          <div style={{position:"absolute",top:-8,right:-60}}>
            <NeonRing value={totalProt} max={TARGET_PROT} size={70} stroke={6} color="var(--orange)">
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:13,fontWeight:800,fontFamily:"var(--mono)",color:"var(--orange)"}}>{totalProt}</div>
                <div style={{fontSize:7,color:"var(--text3)"}}>/{TARGET_PROT}g P</div>
              </div>
            </NeonRing>
          </div>
          <div style={{position:"absolute",bottom:-8,right:-60}}>
            <NeonRing value={log.water||0} max={8} size={70} stroke={6} color="var(--cyan)">
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:13,fontWeight:800,fontFamily:"var(--mono)",color:"var(--cyan)"}}>{log.water||0}</div>
                <div style={{fontSize:7,color:"var(--text3)"}}>/8 💧</div>
              </div>
            </NeonRing>
          </div>
        </div>
        {/* Water controls on the left */}
        <div style={{position:"absolute",left:20,display:"flex",flexDirection:"column",gap:6,justifyContent:"center",marginTop:40}}>
          <button onClick={()=>updateLog(todayKey(),l=>({...l,water:Math.min(8,(l.water||0)+1)}))} style={{width:32,height:32,background:"rgba(0,229,255,0.12)",border:"1px solid rgba(0,229,255,0.3)",borderRadius:10,color:"var(--cyan)",cursor:"pointer",fontWeight:800,fontSize:16,fontFamily:"var(--font)"}}>+</button>
          <button onClick={()=>updateLog(todayKey(),l=>({...l,water:Math.max(0,(l.water||0)-1)}))} style={{width:32,height:32,background:"var(--glass)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text2)",cursor:"pointer",fontSize:16,fontFamily:"var(--font)"}}>−</button>
        </div>
      </div>

      {/* Source tags */}
      {(planKcal>0||trackKcal>0)&&(
        <div style={{display:"flex",gap:6,marginBottom:16,justifyContent:"center",flexWrap:"wrap"}}>
          {planKcal>0&&<Tag color="var(--green)">📋 Plan: {planKcal} kcal</Tag>}
          {trackKcal>0&&<Tag color="var(--cyan)">📓 Track: {trackKcal} kcal</Tag>}
        </div>
      )}

      {/* Weekly bar */}
      <GlassCard style={{marginBottom:12,padding:"14px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontSize:12,fontWeight:700,color:"var(--text2)"}}>📊 Cette semaine</span>
          <span style={{fontSize:11,color:"var(--text3)",fontFamily:"var(--mono)"}}>{activeDays}/7 jours · {weekExercises} exercices</span>
        </div>
        <div style={{display:"flex",gap:4}}>
          {last7.map((d,i)=>{
            const hasLog=!!dailyLogs[d];
            const isSport=dailyLogs[d]?.isSportDay!==false;
            const isT=d===todayKey();
            return(
              <div key={d} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                <div style={{width:"100%",height:36,borderRadius:8,background:hasLog?(isSport?"rgba(168,255,120,0.25)":"rgba(120,180,255,0.2)"):"rgba(255,255,255,0.04)",border:`1px solid ${isT?"rgba(168,255,120,0.4)":"transparent"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>
                  {hasLog?(isSport?"💪":"😴"):""}
                </div>
                <span style={{fontSize:8,color:isT?"var(--green)":"var(--text3)",fontWeight:isT?700:400}}>
                  {["L","M","M","J","V","S","D"][new Date(d+"T12:00:00").getDay()===0?6:new Date(d+"T12:00:00").getDay()-1]}
                </span>
              </div>
            );
          })}
        </div>
      </GlassCard>

      {/* Quick cards grid */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
        {[
          {page:"nutrition",emoji:"📋",label:"Plan Nutrition",sub:`${mp.filter(m=>log.meals?.[m.id]).length}/${mp.length} repas`,val:`${planKcal} kcal`,color:"var(--green)"},
          {page:"tracking",emoji:"📓",label:"Tracking",sub:`${trackItems.length} aliment(s)`,val:`${trackKcal} kcal`,color:"var(--cyan)"},
          {page:"exercise",emoji:"🏋️",label:"Gym",sub:`${log.exercises?.length||0} exercice(s)`,val:log.isSportDay!==false?"💪 Sport":"😴 Repos",color:"var(--orange)"},
          {page:"weekly",emoji:"🧬",label:"Bilan muscu",sub:"Muscles de la semaine",val:"→",color:"var(--purple)"},
        ].map(card=>(
          <GlassCard key={card.page} onClick={()=>setPage(card.page)} style={{padding:14,transition:"all 0.15s",":hover":{background:"var(--glass2)"}}}>
            <div style={{fontSize:24,marginBottom:6}}>{card.emoji}</div>
            <div style={{fontWeight:700,fontSize:13,marginBottom:2}}>{card.label}</div>
            <div style={{fontSize:11,color:"var(--text3)",marginBottom:4}}>{card.sub}</div>
            <div style={{fontSize:12,color:card.color,fontWeight:700,fontFamily:"var(--mono)"}}>{card.val}</div>
          </GlassCard>
        ))}
      </div>

      {/* Supplements quick view — always today's, clickable directly */}
      <GlassCard style={{marginBottom:16,padding:"14px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontWeight:700,fontSize:13}}>💊 Suppléments <span style={{fontSize:10,color:"var(--text3)",fontWeight:400}}>(aujourd'hui)</span></span>
          <Tag color={supps===4?"var(--green)":"var(--text3)"}>{supps}/4 ✓</Tag>
        </div>
        <div style={{display:"flex",gap:8}}>
          {[{id:"vitC",l:"Vit. C",e:"🟠"},{id:"vitD",l:"Vit. D",e:"🟡"},{id:"omega3",l:"Ω-3",e:"🔵"},{id:"magnesium",l:"Mg",e:"🟣"}].map(s=>(
            <div key={s.id} onClick={()=>updateLog(todayKey(),l=>({...l,supplements:{...l.supplements,[s.id]:!l.supplements?.[s.id]}}))}
              style={{flex:1,textAlign:"center",padding:"8px 4px",background:log.supplements?.[s.id]?"rgba(168,255,120,0.1)":"rgba(255,255,255,0.03)",borderRadius:12,border:`1px solid ${log.supplements?.[s.id]?"rgba(168,255,120,0.4)":"var(--border)"}`,cursor:"pointer",transition:"all 0.2s"}}>
              <div style={{fontSize:16}}>{s.e}</div>
              <div style={{fontSize:8,color:log.supplements?.[s.id]?"var(--green)":"var(--text3)",fontWeight:700,marginTop:2}}>{s.l}</div>
              {log.supplements?.[s.id]&&<div style={{fontSize:8,color:"var(--green)"}}>✓</div>}
            </div>
          ))}
        </div>
      </GlassCard>
    </div>
  );
}
