      </GlassCard>

      {/* Stats grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
        {[{l:"Poids",v:`${profile.weight}`,u:"kg",c:"var(--green)"},{l:"IMC",v:bmi,c:"var(--orange)"},{l:"Taille",v:`${profile.height}`,u:"cm",c:"var(--cyan)"},{l:"Âge",v:`${profile.age}`,u:"ans",c:"var(--purple)"},{l:"Streak",v:streak,u:"🔥",c:"var(--orange)"},{l:"PRs",v:Object.keys(allPRs).length,c:"var(--yellow)"}].map(s=>(
          <GlassCard key={s.l} style={{padding:"12px 10px",textAlign:"center"}}>
            <div style={{fontSize:20,fontWeight:800,color:s.c,fontFamily:"var(--mono)",lineHeight:1}}>{s.v}<span style={{fontSize:10,color:"var(--text3)"}}>{s.u||""}</span></div>
            <div style={{fontSize:9,color:"var(--text3)",marginTop:3,textTransform:"uppercase",letterSpacing:0.5}}>{s.l}</div>
          </GlassCard>
        ))}
      </div>

      {editing&&(
        <GlassCard style={{marginBottom:14,padding:16}}>
          {[{k:"name",l:"Prénom",t:"text"},{k:"quote",l:"Citation",t:"text"},{k:"weight",l:"Poids (kg)",t:"number"},{k:"height",l:"Taille (cm)",t:"number"},{k:"age",l:"Âge",t:"number"}].map(f=>(
            <div key={f.k} style={{marginBottom:10}}>
              <label style={{fontSize:10,color:"var(--text3)",fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>{f.l}</label>
              <input type={f.t} value={form[f.k]||""} onChange={e=>setForm(p=>({...p,[f.k]:e.target.value}))}
                style={{display:"block",width:"100%",marginTop:4,background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"9px 12px",color:"var(--text)",fontSize:14,outline:"none",boxSizing:"border-box",fontFamily:"var(--font)"}}/>
            </div>
          ))}
        </GlassCard>
      )}

      {/* Weight log */}
      <GlassCard style={{marginBottom:14,padding:16}}>
        <div style={{fontWeight:700,fontSize:13,marginBottom:12}}>📊 Logger le poids</div>
        <div style={{display:"flex",gap:8}}>
          <input type="number" value={nw} onChange={e=>setNw(e.target.value)} placeholder="Ex: 93.5"
            style={{flex:1,background:"rgba(255,255,255,0.06)",border:"1px solid var(--border2)",borderRadius:10,padding:"10px 14px",color:"var(--text)",fontSize:14,outline:"none",fontFamily:"var(--font)"}}/>
          <button onClick={logW} className="btn-green" style={{padding:"10px 20px",borderRadius:10,fontSize:13}}>Logger</button>
        </div>
        {diff!==0&&<div style={{marginTop:8,fontSize:13,color:diff<0?"var(--green)":"var(--red)",fontWeight:600,fontFamily:"var(--mono)"}}>{diff<0?`▼ ${Math.abs(diff).toFixed(1)} kg perdus`:`▲ ${diff.toFixed(1)} kg pris`} depuis le début</div>}
      </GlassCard>

      {/* Weight graph */}
      {wData.length>=2&&(
        <GlassCard style={{marginBottom:14,padding:16}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:12}}>📈 Évolution du poids</div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:"visible"}}>
            <defs>
              <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="var(--green)" stopOpacity="0.25"/>
                <stop offset="100%" stopColor="var(--green)" stopOpacity="0"/>
              </linearGradient>
            </defs>
            {[wMin,(wMin+wMax)/2,wMax].map((v,i)=>(
              <g key={i}>
                <line x1={PL} y1={ys(v)} x2={W-PR} y2={ys(v)} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>
                <text x={PL-4} y={ys(v)+4} textAnchor="end" fontSize="8" fill="rgba(255,255,255,0.25)" fontFamily="var(--mono)">{v.toFixed(1)}</text>
              </g>
            ))}
            <polygon points={`${xs(0)},${H-PB} ${pts} ${xs(wData.length-1)},${H-PB}`} fill="url(#wg)"/>
            <polyline points={pts} fill="none" stroke="var(--green)" strokeWidth="2.5" strokeLinejoin="round" style={{filter:"drop-shadow(0 0 4px rgba(168,255,120,0.5))"}}/>
            {wData.map((d,i)=>(
              <circle key={i} cx={xs(i)} cy={ys(d.weight)} r="4" fill="var(--green)" style={{filter:"drop-shadow(0 0 4px rgba(168,255,120,0.8))"}}/>
            ))}
          </svg>
        </GlassCard>
      )}

      {/* Top PRs */}
      {topPRs.length>0&&(
        <GlassCard style={{marginBottom:14,padding:16}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:12,color:"var(--yellow)"}}>🏆 Tous les PRs</div>
          {topPRs.map((pr,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--border)"}}>
              <div><div style={{fontSize:12,fontWeight:600}}>{pr.exercise_name}</div><div style={{fontSize:10,color:"var(--text3)",fontFamily:"var(--mono)"}}>{formatDate(pr.date)}</div></div>
              <div style={{fontSize:14,fontWeight:800,color:"var(--yellow)",fontFamily:"var(--mono)"}}>{pr.max_weight.toFixed(0)} lbs</div>
            </div>
          ))}
        </GlassCard>
      )}

      {/* Weight history */}
      <GlassCard style={{marginBottom:14,padding:16}}>
        <div style={{fontWeight:700,fontSize:13,marginBottom:12}}>📋 Historique pesées</div>
        {[...weightHistory].reverse().map((e,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--border)"}}>
            <span style={{fontSize:12,color:"var(--text2)"}}>{e.date===todayKey()?"Aujourd'hui":formatDate(e.date)}</span>
            <span style={{fontSize:12,fontWeight:700,color:"var(--green)",fontFamily:"var(--mono)"}}>{e.weight} kg</span>
          </div>
        ))}
      </GlassCard>

      {/* Graphs — rendered as proper child components to allow useState */}
      <MuscleVolumeGraph dailyLogs={dailyLogs}/>
      <ExerciseProgressGraph dailyLogs={dailyLogs} exStats={exStats}/>
    </div>
  );
}

// ═══════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════
function App(){
  const [user,setUser]=useState(null);
  const [loading,setLoading]=useState(true);
  const [page,setPage]=useState("home");
  const [profile,setProfileState]=useState({name:"Mouad",weight:94,height:179,age:27,quote:"Trust the process"});
  const [dailyLogs,setDailyLogsState]=useState({});
  const [weightHistory,setWeightHistoryState]=useState([{date:todayKey(),weight:94}]);
  const [exStats,setExStatsState]=useState([]);
  const [customFoods,setCustomFoodsState]=useState([]);
  const [programs,setPrograms]=useState(DEFAULT_PROGRAMS);
  const [selectedDay,setSelectedDay]=useState(todayKey());
  const [showPicker,setShowPicker]=useState(false);
  const [syncing,setSyncing]=useState(false);
  const syncQ=useRef({});

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      if(session?.user){setUser(session.user);loadData(session.user.id);}
      else setLoading(false);
    });
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{
      if(session?.user){setUser(session.user);loadData(session.user.id);}
      else{setUser(null);setLoading(false);}
    });
    return()=>subscription.unsubscribe();
  },[]);

  async function loadData(uid){
    setLoading(true);
    try{
      const [p,l,w,es,cf]=await Promise.all([
        sb.from("profiles").select("*").eq("user_id",uid).single(),
        sb.from("daily_logs").select("*").eq("user_id",uid),
        sb.from("weight_history").select("*").eq("user_id",uid).order("date",{ascending:true}),
        sb.from("exercise_stats").select("*").eq("user_id",uid).order("date",{ascending:false}),
        sb.from("custom_foods").select("*").eq("user_id",uid),
      ]);
      if(p.data) setProfileState(p.data.data);
      if(l.data){const logs={};l.data.forEach(r=>{logs[r.date]=r.data;});setDailyLogsState(logs);}
      if(w.data&&w.data.length>0) setWeightHistoryState(w.data.map(r=>({date:r.date,weight:r.weight})));
      if(es.data) setExStatsState(es.data);
      if(cf.data) setCustomFoodsState(cf.data);
    }catch(e){console.error(e);}
    setDailyLogsState(prev=>{if(!prev[todayKey()])return{...prev,[todayKey()]:emptyLog()};return prev;});
    setLoading(false);
  }

  function scheduleSync(type,data){
    if(!user)return;
    // Use a stable key per type — for profile, always the same key so debounce works correctly
    const key=type==="profile"?"profile_sync":type+"_"+(data?.date||"");
    clearTimeout(syncQ.current[key]);
    syncQ.current[key]=setTimeout(async()=>{
      setSyncing(true);
      try{
        if(type==="profile") await sb.from("profiles").upsert({user_id:user.id,data},{onConflict:"user_id"});
        if(type==="log"){const{date,log}=data;await sb.from("daily_logs").upsert({user_id:user.id,date,data:log},{onConflict:"user_id,date"});}
        if(type==="weight"){const{date,weight}=data;await sb.from("weight_history").upsert({user_id:user.id,date,weight},{onConflict:"user_id,date"});}
      }catch(e){console.error(e);}
      setSyncing(false);
    },1500);
  }

  async function saveExStats(stat){
    if(!user)return;
    try{
      const res=await sb.from("exercise_stats").upsert({user_id:user.id,...stat},{onConflict:"user_id,exercise_name,date"}).select();
      if(res.data) setExStatsState(prev=>[...prev.filter(s=>!(s.exercise_name===stat.exercise_name&&s.date===stat.date)),res.data[0]]);
    }catch(e){console.error(e);}
  }

  function setProfile(val){const next=typeof val==="function"?val(profile):val;setProfileState(next);scheduleSync("profile",next);}
  function updateLog(day,fn){
    setDailyLogsState(prev=>{
      const cur=prev[day]||emptyLog();
      const updated=fn(cur);
      const next={...prev,[day]:updated};
      if(user)scheduleSync("log",{date:day,log:updated});
      return next;
    });
  }
  function setWeightHistory(val){
    const next=typeof val==="function"?val(weightHistory):val;
    setWeightHistoryState(next);
    if(next.length>0){const last=next[next.length-1];scheduleSync("weight",last);}
  }
  function createDay(day){
    if(!dailyLogs[day]){const nl=emptyLog();setDailyLogsState(prev=>{const n={...prev,[day]:nl};if(user)scheduleSync("log",{date:day,log:nl});return n;});}
    setSelectedDay(day);
  }
  async function signOut(){await sb.auth.signOut();setUser(null);}

  if(loading) return(
    <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"var(--font)"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:56,marginBottom:16,filter:"drop-shadow(0 0 20px rgba(168,255,120,0.5))"}}>⚡</div>
        <div style={{fontWeight:900,fontSize:24,background:"linear-gradient(135deg,var(--green),var(--cyan))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:8}}>My Fit Lab</div>
        <div style={{color:"var(--text3)",fontSize:13,fontFamily:"var(--mono)"}}>// loading...</div>
      </div>
    </div>
  );
  if(!user) return <AuthScreen onAuth={u=>{setUser(u);loadData(u.id);}}/>;

  function getLog(day){return dailyLogs[day]||emptyLog();}
  const todayLog=getLog(todayKey());
  const selLog=getLog(selectedDay);
  const selPlan=useMemo(()=>buildMealPlan(selLog.isSportDay!==false,selLog.proteinKey||"poulet",selLog.carbKey||"riz"),
    [selLog.isSportDay,selLog.proteinKey,selLog.carbKey]);

  const NAV=[
    {id:"home",l:"Accueil",i:"⬡"},
    {id:"nutrition",l:"Plan",i:"📋"},
    {id:"tracking",l:"Track",i:"📓"},
    {id:"exercise",l:"Gym",i:"🏋️"},
    {id:"weekly",l:"Bilan",i:"🧬"},
    {id:"history",l:"Historique",i:"📅"},
    {id:"profile",l:"Profil",i:"👤"},
  ];

  return(
    <div style={{minHeight:"100vh",background:"var(--bg)",fontFamily:"var(--font)",color:"var(--text)",maxWidth:480,margin:"0 auto",paddingBottom:90}}>
      {/* Background glow */}
      <div style={{position:"fixed",top:0,left:"50%",transform:"translateX(-50%)",width:400,height:400,borderRadius:"50%",background:"radial-gradient(circle,rgba(168,255,120,0.03) 0%,transparent 70%)",pointerEvents:"none",zIndex:0}}/>

      {showPicker&&<DayPicker dailyLogs={dailyLogs} selectedDay={selectedDay} onSelect={d=>setSelectedDay(d)} onClose={()=>setShowPicker(false)} onCreateDay={d=>{createDay(d);}}/>}

      {/* Header */}
      <div style={{background:"rgba(8,11,20,0.95)",backdropFilter:"blur(20px)",padding:"14px 20px 12px",borderBottom:"1px solid var(--border)",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:38,height:38,borderRadius:"50%",background:"linear-gradient(135deg,var(--green),var(--cyan))",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:900,color:"#080b14",boxShadow:"0 0 12px rgba(168,255,120,0.3)"}}>{profile.name[0]}</div>
            <div>
              <div style={{fontWeight:800,fontSize:15,display:"flex",alignItems:"center",gap:6}}>
                {profile.name}
                {syncing&&<span style={{fontSize:8,color:"var(--text3)",animation:"pulse 1s infinite",fontFamily:"var(--mono)"}}>↑ sync</span>}
              </div>
              <div style={{fontSize:9,color:"var(--text3)",fontStyle:"italic",fontFamily:"var(--mono)"}}>// {profile.quote||"trust the process"}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:6}}>
            <div onClick={()=>setShowPicker(true)} style={{background:"var(--glass)",border:"1px solid var(--border2)",borderRadius:20,padding:"5px 12px",fontSize:11,fontWeight:600,color:"var(--text2)",cursor:"pointer",fontFamily:"var(--mono)"}}>
              📅 {selectedDay===todayKey()?"Auj.":formatDate(selectedDay)}
            </div>
            <div onClick={()=>updateLog(todayKey(),l=>({...l,isSportDay:!l.isSportDay}))}
              style={{background:todayLog.isSportDay!==false?"rgba(168,255,120,0.1)":"rgba(120,180,255,0.1)",border:`1px solid ${todayLog.isSportDay!==false?"rgba(168,255,120,0.3)":"rgba(120,180,255,0.3)"}`,borderRadius:20,padding:"5px 10px",fontSize:11,fontWeight:600,color:todayLog.isSportDay!==false?"var(--green)":"#78b4ff",cursor:"pointer"}}>
              {todayLog.isSportDay!==false?"💪":"😴"}
            </div>
          </div>
        </div>
      </div>

      {/* Pages */}
      <div style={{position:"relative",zIndex:1}}>
        {page==="home"&&<HomePage log={todayLog} setPage={setPage} profile={profile} updateLog={updateLog} dailyLogs={dailyLogs} exStats={exStats}/>}
        {page==="nutrition"&&<NutritionPage log={selLog} selectedDay={selectedDay} updateLog={updateLog} setShowPicker={setShowPicker} mealPlan={selPlan}/>}
        {page==="tracking"&&<TrackingPage log={selLog} selectedDay={selectedDay} updateLog={updateLog} setShowPicker={setShowPicker} customFoods={customFoods}/>}
        {page==="exercise"&&<ExercisePage log={selLog} selectedDay={selectedDay} updateLog={updateLog} setShowPicker={setShowPicker} exStats={exStats} saveExStats={saveExStats} programs={programs} setPrograms={setPrograms} profile={profile} dailyLogs={dailyLogs}/>}
        {page==="weekly"&&<WeeklyPage dailyLogs={dailyLogs} exStats={exStats} setPage={setPage}/>}
        {page==="history"&&<HistoryPage dailyLogs={dailyLogs} setSelectedDay={setSelectedDay} setPage={setPage} setShowPicker={setShowPicker}/>}
        {page==="profile"&&<ProfilePage profile={profile} setProfile={setProfile} weightHistory={weightHistory} setWeightHistory={setWeightHistory} onSignOut={signOut} userEmail={user.email} exStats={exStats} dailyLogs={dailyLogs}/>}
      </div>

      {/* Bottom Nav */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"rgba(8,11,20,0.97)",backdropFilter:"blur(28px)",borderTop:"1px solid var(--border)",display:"flex",paddingTop:8,paddingLeft:0,paddingRight:0,paddingBottom:"max(14px, env(safe-area-inset-bottom))",zIndex:50}}>
        {NAV.map(n=>(
          <button key={n.id} onClick={()=>setPage(n.id)} style={{flex:1,background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"4px 1px",color:page===n.id?"var(--green)":"var(--text3)",transition:"color 0.2s",fontFamily:"var(--font)"}}>
            <span style={{fontSize:page===n.id?19:16,transition:"all 0.2s",filter:page===n.id?"drop-shadow(0 0 6px rgba(168,255,120,0.6))":"none"}}>{n.i}</span>
            <span style={{fontSize:8,fontWeight:700,letterSpacing:0.3}}>{n.l}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
